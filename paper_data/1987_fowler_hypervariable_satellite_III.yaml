- heading: Key Collaborators
  body_html: |-
    <p><strong>C. Fowler</strong> — new first-author collaborator (likely Honours or PhD student in Burgoyne lab at Flinders). <strong>R. Drinkwater</strong> (Roger D. Drinkwater) — continuing collaborator from the 1986 satellite II paper and the 1987 chromatin paper. <strong>J. Skinner</strong> (Jennifer D. Skinner) — long-term collaborator since 1979, bridging the chromatin superstructure and satellite DNA programmes.</p>
