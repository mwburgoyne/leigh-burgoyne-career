- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Identification of satellite III sequences as a source of individual-discriminating DNA polymorphism</li>
    <li>Foundation for forensic applications of satellite DNA-based identification systems</li>
    <li>Mechanistic understanding of how CpG point mutations within tandem repeats generate restriction fragment length polymorphism</li>
    <li>Connection between satellite III sequences, autosomal polymorphism, and Y-chromosome biology</li>
    <li>Burgoyne lab’s continuing satellite DNA programme and eventual transition to forensic DNA technology</li>
    <li>Burgoyne’s FTA card patent (1994) — the satellite DNA work on individual identification directly informed the development of rapid DNA collection and preservation technology</li>
    <li><a href="2004_smith_burgoyne_wildlife_FTA_databasing.html">Smith &amp; Burgoyne (2004)</a> — wildlife DNA identification using FTA cards, extending the forensic DNA trajectory launched by the satellite programme</li>
    <li>Sequence deposit (Y00139) contributing to the growing human satellite III sequence database</li>
    </ul>
