- heading: Key Collaborators
  body_html: |-
    <p><strong>Norman H. Giles</strong> — Distinguished geneticist at Yale, specialist in Neurospora genetics and gene clusters. <strong>Mary E. Case</strong> — Long-term collaborator with Giles on the <em>arom</em> system. This collaboration represents Burgoyne's postdoctoral period at Yale before taking up his position at Flinders University.</p>
