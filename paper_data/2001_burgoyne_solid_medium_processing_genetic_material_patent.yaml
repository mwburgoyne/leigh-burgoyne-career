sections:
- heading: Context & Background
  body_html: |-
    <p>This patent (US 6,322,983 B1) is the eighth US patent in the FTA card family, a further continuation from the US 5,985,327 chain. The specification and examples are identical to all prior family members. What distinguishes this patent is its use of “consisting of” — closed transitional language that limits the invention to exactly the recited elements. All seven prior FTA patents used “comprising” (open) or means-plus-function formulations.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Claim 1:</strong> Solid medium <em>consisting of</em> a solid matrix and a composition <em>consisting of</em> a protein denaturing agent and an inhibitor of an action of a nuclease — the simplest two-component closed claim in the family.</li>
    <li><strong>Claim 2:</strong> Method <em>consisting essentially of</em> applying genetic material to such a medium and processing the sample.</li>
    <li><strong>Claim 3:</strong> Method with composition <em>comprising</em> a protein denaturing agent, chelating agent, and uric acid.</li>
    <li><strong>Claim 4:</strong> Solid medium <em>consisting of</em> a solid matrix with protein denaturing agent, “compound that binds ions which promote degradation of DNA,” and a buffer.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>First use of closed “consisting of” claim language in the FTA estate, complementing open claims. Introduction of “inhibitor of an action of a nuclease” — broader than “chelating agent” alone. Title broadened from “Storage” to “Processing” of genetic material. Together, the eight core FTA continuations now span every major claim strategy.</p>
