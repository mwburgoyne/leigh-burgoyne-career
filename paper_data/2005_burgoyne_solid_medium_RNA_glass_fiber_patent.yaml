- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Extended FTA patent protection to RNA storage for viral diagnostics and gene expression research</li>
    <li>Secured IP coverage for glass fiber FTA products (e.g., FTA Elute cards) with improved release characteristics</li>
    <li>Provided Whatman with broad defensive claims using simplified surfactant-only formulations</li>
    <li>Supported commercial expansion into automated laboratory systems requiring engineered fiber substrates</li>
    </ul>
