- heading: Context & Background
  body_html: |-
    <p>This is the foundational patent for what became the FTA card — arguably the most commercially and practically important invention of Burgoyne's career. Filed originally in Australia on October 5, 1988, the same year as the macrosatellite polymorphism paper (Fowler et al. 1988 <em>Hum Genet</em>), this patent represents the convergence of Burgoyne's deep understanding of DNA biochemistry (nuclease mechanisms, metal ion cofactors, chromatin stability) with the practical needs of forensic DNA analysis. The patent addresses a fundamental problem: how to safely store, transport, and use DNA from blood samples without refrigeration, sterility requirements, or technical expertise at the collection site. The solution — a chemically treated filter paper — draws directly on Burgoyne's decades of experience with DNA degradation mechanisms, chelation chemistry, and enzymatic protection.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>The solid medium composition:</strong> A cellulose-based matrix (filter paper) impregnated with a composition of: (a) a weak base (Tris) to maintain alkaline pH 8.0–9.5; (b) a chelating agent (EDTA) to bind Ca<sup>2+</sup>, Mg<sup>2+</sup>, and Fe; (c) an anionic detergent (SDS) to denature proteins and inactivate pathogens; and optionally (d) uric acid or urate salt as a free-radical trap for long-term storage.</li>
    <li><strong>Multi-layered DNA protection rationale:</strong> Each component addresses a specific degradation pathway — EDTA prevents nuclease activity (Ca/Mg cofactors) and iron-catalysed free radical damage; SDS denatures autolytic enzymes and pathogenic organisms; alkaline pH inhibits acid nucleases; uric acid scavenges free radicals (converted to allantoin) and aids DNA desorption from paper.</li>
    <li><strong>Pathogen inactivation:</strong> SDS non-specifically destroys secondary structure of coat proteins, internal proteins, and membranes of most pathogens, enabling safe postal transport. Exceptions noted: most resistant bacterial spores and some stable enteric virions, but these are not blood-borne concerns.</li>
    <li><strong>In situ PCR:</strong> DNA stored on the treated paper can be amplified directly by PCR after protein removal (phenol treatment) and ion exchange (isopropanol/magnesium acetate wash). Three PCR targets demonstrated: n-Ras exon 2 (110 bp), Y-chromosome repeat (124 bp), and Y-chromosome repeat (250 bp). All gave results equivalent to extracted DNA.</li>
    <li><strong>Long-term storage with polystyrene encasement:</strong> For archival storage of purified DNA (plasmids, clones), paper treated with uric acid/Tris is loaded with DNA, dried, then dipped in polystyrene/chloroform solution. Stored at −15°C with silica gel desiccant and sodium carbonate. Demonstrated ~100% recovery after 36 months (vs &lt;10% from untreated paper).</li>
    <li><strong>DNA record cards:</strong> Whatman No. 1 paper marked with Indian ink/graphite pencil, autoclaved, treated with 40 mM uric acid / 100 mM Tris for systematic storage and retrieval of DNA samples.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific and commercial contribution:</strong> This patent is the intellectual foundation of FTA (Flinders Technology Associates) card technology, which became a global standard for DNA collection, storage, and transport in forensic science, newborn screening, veterinary diagnostics, agricultural genetics, and biodiversity sampling. The technology was licensed and commercialised internationally (initially through Life Technologies, later GE Healthcare/Whatman). FTA cards have been used by law enforcement agencies, hospitals, and researchers worldwide. The patent demonstrates Burgoyne's characteristic approach of applying fundamental biochemical understanding (nuclease mechanisms from the 1970s, chelation chemistry, free radical biology) to solve a pressing practical problem.</p>
    <p><strong>Career significance:</strong> This patent marks the decisive transition from academic research to applied technology and commercialisation. Burgoyne is the sole inventor. The assignee, Flinders Technologies Pty Ltd, was the university's technology transfer vehicle. The priority date (October 1988) means this invention was conceived during the satellite III/macrosatellite forensic DNA work — the practical need for safe DNA transport directly motivated the invention. The connection to his fundamental research is explicit: the EDTA chelation of Ca<sup>2+</sup> and Mg<sup>2+</sup> to prevent nuclease activity is the same principle that underlies the Ca-Mg endonuclease work from 1970–1975, and the understanding of DNA degradation mechanisms draws on decades of chromatin biochemistry.</p>
