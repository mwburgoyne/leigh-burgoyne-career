sections:
- heading: Context & Background
  body_html: |-
    <p>This paper extends the 1991 BBRC study of endogenous nuclear autophosphorylation to examine phosphorylation by exogenously added purified protein kinase C (PKC). While the 1991 paper showed that chromatin conformation controls endogenous kinase targeting, this companion paper asks whether exogenous PKC — a key signal transduction enzyme known to be present in nuclei — is similarly regulated by substrate conformation. The study uses four different cell types (HL-60, HeLa, 3T3, primary lymphocytes) to reveal striking cell-type differences. Published in <em>Cellular Signalling</em>, a dedicated signalling journal, with A.W. Murray as corresponding author. Again uses the Buffer-A system from the 1970 and 1973 Burgoyne papers.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Exogenous PKC requires expanded chromatin:</strong> Chromatin-associated proteins were only phosphorylated by exogenously added purified rat brain PKC when the chromatin was in an expanded (decondensed) state. Condensed nuclei in all cell lines were unresponsive.</li>
    <li><strong>Dramatic cell-type differences:</strong> HL-60 and HeLa nuclear proteins were unresponsive to exogenous PKC under all conditions. In contrast, 3T3 fibroblasts showed moderate responsiveness, and primary lymphocytes showed dramatic PKC-dependent phosphorylation of many proteins when chromatin was expanded.</li>
    <li><strong>Ca<sup>2+</sup>/phospholipid dependence:</strong> PKC-dependent phosphorylation in responsive cells required calcium and phosphatidylserine, confirming genuine PKC activity. EGTA abolished PKC-specific bands.</li>
    <li><strong>HL-60/HeLa unresponsiveness explained:</strong> Not due to PKC inactivation (added histones were phosphorylated normally). Likely due to higher endogenous PKC activity in these cell lines maintaining substrates in a constitutively phosphorylated state.</li>
    <li><strong>Nuclease modulation:</strong> Both DNase-I and micrococcal nuclease strongly modulated phosphorylation patterns, confirming substrates are DNA-associated. The two nucleases produced different pattern changes, ruling out the trivial explanation that nuclease effects operate via polyamine release from degraded DNA.</li>
    <li><strong>Concordance with in vivo data:</strong> In vivo, HL-60 cells do not exhibit phorbol ester-induced nuclear phosphorylation, while 3T3 cells do — consistent with the in vitro results.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This was the first in vitro study of exogenous PKC-mediated phosphorylation of chromatin-associated proteins conducted under conditions maintaining chromatin integrity and structure. Previous studies had used purified individual nuclear proteins or crude nuclear fractions. The discovery that chromatin condensation state gates PKC access to its nuclear substrates provided a mechanistic link between chromatin structure and signal transduction. The cell-type differences in PKC responsiveness added biological complexity, suggesting that the “phosphorylation state” of nuclear proteins varies between cell types in ways that mirror their in vivo responses to PKC-activating signals.</p>
    <p><strong>Career significance:</strong> Third and most substantial Testori/Burgoyne/Murray collaboration (after 1988 PKC/DNA-binding and 1991 autophosphorylation papers). Published in <em>Cellular Signalling</em> — a higher-profile signalling journal than BBRC. This trilogy represents the fullest development of the bridge between Burgoyne’s chromatin expertise and Murray’s PKC signalling programme. The continued use of Buffer-A (now 22 years old) underscores the enduring utility of Burgoyne’s foundational methodology.</p>
