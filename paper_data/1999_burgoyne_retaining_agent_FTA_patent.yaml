- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li>Burgoyne US 5,496,562 (1994/1996): Foundational FTA patent — core composition and single phase phenol wash</li>
    <li>Burgoyne US 5,756,126 (1998): CIP patent introducing analytical platform concept, pre-loaded primers, target sequence stabilizers</li>
    <li>Ser. No. 08/320,041 (abandoned): Related application referenced for automated fluid delivery systems</li>
    <li>Burgoyne’s chromatin/nuclease research (1970s–1980s): Understanding of DNA degradation mechanisms and chelation chemistry</li>
    <li>McCabe et al. (1987) — DNA microextraction from dried blood spots on filter paper: prior art for filter-paper-based DNA collection</li>
    <li>Stapleton patent family (Re. 35,716 and six related patents): Competitor prior art for treated paper-based analyte storage</li>
    </ul>
  box_style: connections
- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Specific IP protection for the wax-carrier retaining agent system — the physical mechanism enabling pre-loaded analytical cards to survive processing</li>
    <li>Thermally-triggered release concept: wax melting during first PCR cycle liberates protected primers</li>
    <li>Protection of the practical workflow: pre-load card with primers, collect sample, wash card, run PCR — all without manual primer addition</li>
    <li>Enabled purpose-built diagnostic card folios: cards pre-loaded with specific primer sets for particular screening applications (forensic identification, disease screening, viral detection)</li>
    <li>Strengthened overall FTA patent portfolio for Flinders Technologies Pty. Ltd. with a mechanistically distinct claim set</li>
    <li>Extended applicability to automated robotic systems (96-well plate format with pre-loaded discs)</li>
    </ul>
  box_style: connections
- heading: Key Collaborators
  body_html: |-
    <p><strong>Leigh Alexander Burgoyne</strong> — Sole inventor. Address listed as Mitcham, Australia (contrasting with Seaford on US 5,807,527 and Mitcham on US 5,976,572). The consistent sole inventorship across the FTA patent family underscores Burgoyne’s singular role in conceiving and developing both the core FTA chemistry and the practical systems for its deployment. Assignee: Flinders Technologies Pty. Ltd., Australia.</p>
