- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li><strong><a href="2008_burgoyne_bioprofiling_illicit_drugs.html">Burgoyne, Catcheside &amp; Kirkbride (2008)</a>:</strong> "The bioprofiling of illicit drugs" — NDLERF Monograph 30, the first study demonstrating that human DNA is present within drug powders, providing the foundational discovery that motivated this follow-up feasibility study</li>
    <li><strong><a href="1994_burgoyne_solid_medium_DNA_storage_patent.html">Burgoyne (1994)</a>:</strong> FTA patent and subsequent FTA technology development — the DNA preservation and purification principles developed for FTA cards underpin the sample handling and DNA recovery methods used here</li>
    <li><strong>Waters et al. (2012):</strong> Arbitrary single primer amplification for profiling trace DNA — parallel forensic DNA method development at Flinders, exploring alternative amplification strategies for degraded samples</li>
    <li><strong>Broader Phase 4 applied forensic biology programme:</strong> Builds on Burgoyne's accumulated expertise in extracting and profiling DNA from unconventional and challenging biological samples (bacterial typing, wildlife conservation, soil metagenomics)</li>
    </ul>
  box_style: connections
- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Established the forensic utility and practical feasibility of human DNA profiling from drug seizures, moving the concept from discovery (2008) to operational assessment</li>
    <li>Provided detailed protocols and success conditions for law enforcement agencies considering implementation of drug seizure DNA profiling</li>
    <li>Demonstrated that both STR and mitochondrial DNA approaches are viable, depending on DNA quality and quantity</li>
    <li>Identified pH and chemical environment as critical factors determining DNA survival in drug powders</li>
    <li>Showed that multiple donor profiles are common, reflecting the multi-handler nature of drug distribution</li>
    <li>Created a new forensic intelligence capability: using molecular traces embedded in drug powders to link seizures and identify handlers higher up the supply chain</li>
    <li>Contributed to the broader expansion of forensic DNA science beyond traditional biological samples into trace and environmental DNA domains</li>
    <li>Connected to Burgoyne's subsequent soil metagenomics work (2013-2015), which similarly applies trace DNA recovery and profiling methods to environmental samples in forensic and ecological contexts</li>
    </ul>
  box_style: connections
- heading: Key Collaborators
  body_html: |-
    <p><strong>D. E. A. Catcheside</strong> — long-term collaborator at Flinders University School of Biological Sciences, co-author on the 2008 NDLERF monograph and multiple other publications; Catcheside brought genetics and molecular biology expertise to Burgoyne's forensic projects.</p><p><strong>P. Kirkbride</strong> — Australian Federal Police forensic expert, co-author on both the 2008 and 2012 NDLERF monographs; Kirkbride provided operational law enforcement perspective and ensured the research addressed real-world investigative needs.</p><p><strong>C. Pearman</strong> — Forensic Science South Australia; contributed forensic laboratory expertise and operational forensic profiling experience.</p><p><strong>Graham Eariss</strong> — acknowledged in the monograph; Flinders University colleague who provided technical or analytical support.</p><p>Funded by the National Drug Law Enforcement Research Fund (NDLERF), reflecting the operational and policy significance of the work.</p>
