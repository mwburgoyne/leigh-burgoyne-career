- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li><mark>Burgoyne’s</mark> FTA paper technology (US Patent 5,496,562, 1996) — the paper explicitly discusses FTA paper’s limitations for field use with hard tissues, motivating the wire-based alternative</li>
    <li>Robertson, Ross &amp; <mark>Burgoyne</mark> (eds.), <em>DNA in Forensic Science</em> (1990) — foundational DNA forensic methods</li>
    <li>ISFG recommendations for DVI genetic analysis (Prinz et al., 2007)</li>
    <li>Emerging microfluidic and chip-based forensic DNA systems (Hopwood et al., 2010; Greenspoon et al., 2008)</li>
    </ul>
  box_style: connections
- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Proof of concept for extraction-free, field-deployable DNA profiling in disaster victim identification scenarios</li>
    <li>Demonstrated feasibility of magnetically manipulable wire substrates for future automated profiling chips</li>
    <li>Advanced the concept of “sample-on-substrate” approaches where collection medium doubles as PCR-compatible carrier</li>
    <li>Contributed to the broader literature on direct PCR from minimally processed samples</li>
    </ul>
