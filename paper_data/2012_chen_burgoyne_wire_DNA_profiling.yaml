sections:
- heading: Context & Background
  body_html: |-
    <p>Disaster victim identification (DVI) often involves the challenging logistics of sorting many tissue fragments from a small number of individuals. Existing workflows for DNA profiling require labor-intensive steps — tissue solubilization, DNA purification, yield estimation, and careful pipetting — all of which demand laboratory infrastructure and considerable time. This paper, funded by the Australian Government through the “Closed-Set Human Identification” project managed by ANZPAA NIFS, addressed the gap by developing a radically simplified sampling method that could bypass DNA extraction entirely and operate on a portable Agilent 2100 Bioanalyser platform. <mark>Burgoyne’s</mark> group at Flinders University, in collaboration with Forensic Science South Australia and the Australian Federal Police, set out to create a system suitable for remote or field conditions.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Hot wire sampling works:</strong> Stabbing human tissue or blood clots with stainless steel wire heated to red heat, followed by isopropanol fixation and drying, yielded sufficient DNA for direct PCR amplification — completely bypassing DNA extraction and quantification.</li>
    <li><strong>Hot wire outperforms cold wire:</strong> Hot wire bound more DNA than cold wire, likely because heat-denatured proteins form a gel that promotes tissue adherence. Hot wire also ensured self-sterilization at the moment of sampling.</li>
    <li><strong>Works across diverse tissues:</strong> Full quintuplex STR profiles were obtained from blood clots, prostate, bladder, skin, colon, muscle, liver, lung, kidney, and pancreas. DNA yields ranged from ~0.25 ng (muscle) to ~10.27 ng (kidney) per 2-mm wire tip.</li>
    <li><strong>Minimal PCR inhibition:</strong> A 2-mm wire tip in a 25-μL PCR reduced amplification yield by approximately 25% — an acceptable trade-off for the massive gain in speed and simplicity.</li>
    <li><strong>Samples stable for months:</strong> Wire-mounted samples stored at room temperature remained amplifiable for at least 180 days, with no time-dependent degradation.</li>
    <li><strong>Compatible with full forensic profiling:</strong> Samples on wire could be amplified with AmpFlSTR Profiler Plus (9 loci) at 32 cycles, yielding useful profiles on an AB 3130xl Genetic Analyzer — enabling both rapid field triage and full laboratory genotyping from the same sample.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This paper represents a creative “lateral thinking” approach to forensic DNA technology that is characteristic of <mark>Burgoyne’s</mark> career. Rather than pursuing ever-more-complex microfluidic integration, the team asked: what if you could skip DNA extraction altogether? The wire-based method is strikingly simple — a heated wire, isopropanol fixation, and direct PCR — yet it solves a real operational problem in disaster victim identification. The dual-mode capability (field triage on a Bioanalyser plus later laboratory analysis from the same wire) is particularly elegant, as it preserves evidentiary value while enabling rapid on-site decisions. The work represents a conceptual descendant of <mark>Burgoyne’s</mark> FTA paper invention, applying the same “simplify the sample collection” philosophy to hard tissues under austere field conditions.</p>
