sections:
- heading: Context & Background
  body_html: |-
    <p>This patent (US 6,294,203 B1) is the seventh US patent in the FTA card family and represents both a strategic evolution in claim language and a significant commercial transition. It is a continuation of US 5,976,572, tracing back through US 5,756,126 and US 5,496,562 to the original 1988 Australian priority filing. The specification is identical to the prior family members. Two features distinguish this patent: First, the assignee has changed from Flinders Technologies Pty. Ltd. to <strong>Whatman plc</strong> (Kent, GB), marking the commercial acquisition of the FTA technology by the established British filtration and paper products company. Second, the claims have been reduced to their most abstract means-plus-function formulation — just 6 claims using the broadest possible patent language.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Claim 1 — Broadest possible apparatus claim:</strong> A dry solid medium comprising a solid matrix for sorbing genetic material and “preserving means” for protecting genetic material from degradation. No specific chemicals, pH values, detergents, chelators, or antioxidants are named.</li>
    <li><strong>Claim 2 — Releasing means:</strong> Further including “releasing means” for releasing genetic material from the matrix.</li>
    <li><strong>Claim 3 — Heat releasing means:</strong> Releasing via application of heat, covering the wax-carrier approach from US 5,972,386.</li>
    <li><strong>Claims 4–6 — Method claims:</strong> Mirror the apparatus claims as method claims using the same abstract language.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Patent strategy:</strong> This continuation represents the ultimate distillation of FTA patent claim language. Where the foundational patent named specific chemicals and intermediate continuations used functional groupings, this patent strips everything to pure means-plus-function language. With only 6 claims, it is the most economical patent in the family — a final sweeper filing to capture remaining claim space.</p>
    <p><strong>Commercial significance:</strong> The change of assignee to Whatman plc marks a landmark commercial event. Whatman acquired FTA technology and integrated it as “Whatman FTA Cards,” bringing global manufacturing, distribution, and marketing resources to what had been an Australian university technology. Whatman would later be acquired by GE Healthcare.</p>
