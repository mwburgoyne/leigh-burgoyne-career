sections:
- heading: Context & Background
  body_html: |-
    <p>By 1985, <mark>Burgoyne</mark> had spent a decade investigating chromatin superstructure, following the landmark 1973 discovery of chromatin substructure with Hewish. The dinucleosomal repeat phenomenon discovered with John Skinner (1981, 1982) had profound implications: when chromatin is digested with nuclease, every second nucleosome is preferentially cut, suggesting that chromatin is not a simple uniform string of nucleosomes but has an alternating accessibility pattern. This finding contradicted the dominant structural model of the time — the solenoid model proposed by Finch &amp; Klug (1976), in which nucleosomes coil into a regular helix like a spring.</p><p>The dinucleosomal repeat required a different geometry. <mark>Burgoyne</mark> had accepted that the nucleosome filament adopts a zig-zag conformation (the first-order zig-zag), but how does this zig-zag then fold into higher-order structures? This paper addresses that question with a bold theoretical proposal: the zig-zag nucleofilament folds back on itself in large hairpin loops, bringing zig-zags into back-to-back alignment. This fold-back model was more compatible with the dinucleosomal repeat evidence than any coiling model, and it had a profound implication — base sequence could control folding patterns by determining nucleosome spacing.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Fold-back model for higher-order chromatin structure:</strong> <mark>Burgoyne</mark> proposed that zig-zag nucleofilaments fold back on themselves in large, uncoiled hairpin loops. The zig-zags are brought back-to-back, creating a compact structure without requiring coiling into solenoids or helices. This is a fundamentally different geometry from the Finch &amp; Klug solenoid model.</li>
    <li><strong>Explains dinucleosomal repeat:</strong> The fold-back model naturally accounts for the dinucleosomal repeat phenomenon. When zig-zags are aligned back-to-back, every second nucleosome faces outward (accessible to nuclease) while the alternating nucleosomes face inward (protected). This provides a structural explanation for the preferential cleavage pattern observed with Skinner.</li>
    <li><strong>Explains superbead features:</strong> Electron microscopy often reveals chromatin organised into “superbeads” — large globular structures. <mark>Burgoyne</mark> argues that these are the visible consequence of nested fold-backs, where the back-to-back zig-zags themselves fold again into compact globules.</li>
    <li><strong>Base sequence control of folding:</strong> A key insight is that nucleosomal spacing (which is determined by DNA sequence) controls where and how the zig-zag folds back. This means that chromatin condensation is not random but is encoded in the base sequence itself — an idea that would resurface in the 1999 pyknosis paper.</li>
    <li><strong>Mechanism for meiotic synaptic alignment:</strong> <mark>Burgoyne</mark> proposed that the fold-back model suggests a simple way to ensure homologous alignment of nucleofilaments during meiotic chromosome pairing (synapse). If homologous sequences fold in the same pattern, they will naturally align when brought together, facilitating recombination.</li>
    <li><strong>Alternative to solenoid models:</strong> The paper systematically argues that fold-back geometry is more compatible with experimental evidence than coiling models (solenoids, coiled ribbons). Solenoid models predict uniform accessibility; fold-back models predict alternating accessibility, which is exactly what the dinucleosomal repeat shows.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific significance:</strong> This is a key theoretical paper in <mark>Burgoyne</mark>’s chromatin superstructure programme. While the solenoid model eventually became the dominant framework in the field (largely because it was championed by Aaron Klug, who won the 1982 Nobel Prize for his crystallographic work on the nucleosome core), <mark>Burgoyne</mark>’s fold-back model offered a different perspective and was directly motivated by experimental evidence (the dinucleosomal repeat) that solenoid models struggled to explain. The model’s prediction that base sequence controls folding patterns was prescient — modern chromatin biology recognises that sequence-dependent nucleosome positioning and spacing are critical determinants of chromatin state.</p>
    <p><strong>Career significance:</strong> This is a sole-author theoretical paper, representing <mark>Burgoyne</mark>’s mature synthesis of a decade of chromatin structure research. It builds directly on the dinucleosomal repeat work with Skinner and anticipates the sequence-dependent chromatin folding ideas that would appear in the satellite DNA papers (1986–1989) and ultimately in the pyknosis paper (1999). The paper demonstrates <mark>Burgoyne</mark>’s willingness to challenge dominant paradigms (the solenoid model) with alternative models grounded in his own experimental observations. Funded by the Australian Research Grants Scheme.</p>
  box_style: influence
- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li><strong>Hewish &amp; Burgoyne (1973):</strong> Landmark chromatin substructure discovery — the foundation for all subsequent chromatin superstructure work</li>
    <li><strong><a href="1981_burgoyne_chromatin_superstructure_alternating.html">Burgoyne &amp; Skinner (1981)</a>:</strong> Chromatin superstructure and dinucleosomal repeat — the key experimental evidence motivating the fold-back model</li>
    <li><strong><a href="1982_burgoyne_avian_erythrocyte_dinucleosomal.html">Burgoyne &amp; Skinner (1982)</a>:</strong> Avian erythrocyte chromatin degradation — further characterisation of the dinucleosomal repeat phenomenon</li>
    <li><strong>Burgoyne (1983):</strong> Trypsin resistance of chromatin superstructure — evidence for modulation of higher-order structure</li>
    <li><strong>Finch &amp; Klug (1976):</strong> Solenoid model of chromatin structure — the dominant model that <mark>Burgoyne</mark>’s fold-back model challenges</li>
    <li><strong><a href="1974_kornberg_chromatin_repeating_unit_nucleosome.html">Kornberg (1974)</a>:</strong> Nucleosome model — the first-order structure upon which all higher-order models are built</li>
    <li><strong>Davies, Murray &amp; Walmsley (1974):</strong> Electron microscopy observations of chromatin superbeads and superunit threads</li>
    </ul>
  box_style: connections
- heading: What It Contributed To
  body_html: |-
    <ul>
    <li><strong>Burgoyne (1987):</strong> DNase I disomal series paper (coherent to 16N) — further experimental evidence for the back-to-back zig-zag organisation</li>
    <li><strong>Burgoyne (1987):</strong> Chromatin structures with mixed patterns — continuation of the higher-order structure investigations</li>
    <li><strong>Satellite DNA papers (1986–1989):</strong> Sequence-dependent chromatin folding — the fold-back model predicts that satellite DNA sequences with specific spacing could produce distinctive chromatin structures</li>
    <li><strong>Burgoyne (1999):</strong> Pyknosis and hypercondensation — the idea that conformational states of chromatin are sequence-dependent and controllable, first articulated in this 1985 paper, reappears in the pyknosis model fourteen years later</li>
    <li>Provided an alternative theoretical framework to the solenoid model, grounded in dinucleosomal repeat experimental evidence</li>
    <li>Predicted sequence-dependent control of chromatin folding patterns — an idea now central to chromatin biology</li>
    <li>Proposed a structural basis for meiotic synaptic alignment of homologous chromosomes</li>
    <li>Established that higher-order chromatin structure is not a simple coil but involves complex fold-back geometries with alternating nucleosome accessibility</li>
    </ul>
  box_style: connections
- heading: Key Collaborators
  body_html: |-
    <p>This is a <strong>sole-author theoretical paper</strong>, reflecting <mark>Burgoyne</mark>’s synthesis of his own experimental work (particularly the dinucleosomal repeat studies with John Skinner, 1981–1982) into a coherent structural model. Funded by the Australian Research Grants Scheme. No collaborators or technical assistance are acknowledged, suggesting this was an entirely independent intellectual contribution.</p>
