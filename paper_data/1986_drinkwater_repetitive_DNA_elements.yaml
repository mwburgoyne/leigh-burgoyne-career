sections:
- heading: Context & Background
  body_html: |-
    <p>This brief data note marks a major transition in Burgoyne’s research programme — from chromatin higher-order structure to repetitive DNA sequences and satellite DNA. Using a human sperm library enriched for repetitive sequences, the lab identified two novel repeat elements not classified by major sequence data banks. This paper establishes the foundation for what would become a sustained satellite DNA research programme through the late 1980s and early 1990s. Roger D. Drinkwater appears as a new first-author collaborator. Notably, J. D. Skinner — the long-term collaborator from the chromatin superstructure papers — is now identified by full name as Jennifer D. Skinner.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>35s — a new interspersed repeat element:</strong> A 107 bp sequence matching a section of the human Factor IX gene (intron-A, positions 5192–5296, 79% homology). Southern blot analysis with eight restriction enzymes showed banding patterns inconsistent with a single Factor IX locus — implying many unit-length variations interspersed throughout the genome. Copy number estimated at 250–500 per diploid genome (by dot blot comparison with ALU). Located 208 bp from a known 50 bp insertion polymorphism in Factor IX.</li>
    <li><strong>227s — a satellite II tandem repeat:</strong> Identified as satellite II class based on diagnostic features: a TaqI site, fragmented/degenerated ATTCC internal tandem repeat, and characteristic EcoRI restriction pattern. Southern blots with EcoRI or HaeIII produced extensive ladders based on multiples of ~220 bp, confirming the tandem repeat unit length. EcoRI multiples: 6, 8, 10, 11, 12, 14, 15, 17. HaeIII multiples: 5, 7, 9, 11. Copy number ~2,500 per diploid genome.</li>
    <li><strong>Human sperm library approach:</strong> The use of a repetitive-sequence-enriched sperm DNA library as a discovery tool for novel repeat elements was methodologically notable.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> While brief, this paper reports the identification of two previously unclassified human repetitive DNA elements. The 227s satellite II sequence is particularly significant as it launches the Burgoyne lab’s satellite DNA programme that would produce multiple papers through the late 1980s and early 1990s on satellite III polymorphisms, macrosatellites, and their use in forensic and phylogenetic applications. The 35s interspersed repeat in the Factor IX gene connects to clinically relevant genetics (haemophilia B).</p>
    <p><strong>Career significance:</strong> This paper represents the beginning of a new research direction — the transition from chromatin superstructure to repetitive DNA genomics. The connection is natural: Burgoyne’s chromatin work had been concerned with DNA organisation within nuclei, and repetitive DNA is a major component of that organisation. Roger D. Drinkwater appears as a new collaborator (first author, likely a postdoc or PhD student). Jennifer D. Skinner continues from the chromatin papers, now revealed by full name. Published in Nucleic Acids Research as a data note format — rapid communication of sequence discoveries.</p>
