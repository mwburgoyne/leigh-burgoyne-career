sections:
- heading: Context & Background
  body_html: |-
    <p>This is the companion paper to the landmark chromatin substructure paper (Hewish &amp; Burgoyne, 1973, pp. 504–510), submitted on the same day (28 March 1973) and published in the same issue of BBRC. While the chromatin paper demonstrated <em>what</em> the Ca-Mg endonuclease reveals about chromatin structure, this paper characterises the enzyme itself: its divalent cation requirements, molecular weight, tissue distribution, behaviour during liver regeneration, and its distinction from a separate Mg-dependent endonuclease found in different nuclear preparations. This paper was referenced as "in preparation" (ref. 7) in the chromatin substructure paper.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Absolute requirement for both Ca<sup>2+</sup> and Mg<sup>2+</sup>:</strong> The nuclear endonuclease required both calcium and magnesium ions for activity. Neither ion alone produced significant activity. This distinguished it from the bulk of cellular nucleases (in cytoplasm and light-particulate fractions), which were primarily Mg-activated.</li>
    <li><strong>Nuclear localisation confirmed:</strong> When cells were fractionated into crude nuclear, light-particulate, and soluble fractions (in presence of EDTA/EGTA), calcium-dependent endonuclease was reliably detected only in the nuclear fraction.</li>
    <li><strong>Molecular weight ~40,000 (with Mg) or ~20,000 (without):</strong> Sephadex G200 chromatography showed the enzyme eluted as a single peak of MW ~40,000 in the presence of Mg<sup>2+</sup>. Without Mg<sup>2+</sup> (plus EDTA), the apparent MW halved to ~20,000 and the enzyme lost much of its calcium dependence — suggesting a Mg-dependent dimer.</li>
    <li><strong>Activates DNA toward polymerase action:</strong> Crude extracts containing Ca-Mg endonuclease activity could activate calf thymus DNA for the high-MW ascites DNA polymerase — confirming the connection to the Ca<sup>2+</sup>-dependent "priming" of DNA synthesis observed in the 1970 papers.</li>
    <li><strong>Increases ~6-fold during late liver regeneration:</strong> In regenerating rat liver, nuclear Ca-Mg endonuclease decreased slightly until ~24 hours post-hepatectomy, then rose to approximately 6 times resting activity by 72 hours. The rise occurred <em>after</em> maximal DNA synthesis, with no obvious correlation to replication timing. Cytoplasmic endonuclease activity was unchanged.</li>
    <li><strong>Broad tissue distribution:</strong> Ca-Mg endonuclease detected in nuclei from mouse liver, normal and regenerating rat liver, rat thymus, rabbit thymus, and calf thymus. Absent from rabbit bone marrow preparations.</li>
    <li><strong>Distinct Mg-only endonuclease in buffer D nuclei:</strong> Nuclei isolated in buffer D (containing glycine/HEPES instead of polyamines) contained ~7x more total endonuclease than buffer A nuclei, but this activity required only Mg<sup>2+</sup> (Ca<sup>2+</sup> stimulatory but not essential). Critically, this Mg endonuclease was virtually inactive on nuclear DNA <em>in situ</em>, unlike the Ca-Mg enzyme which attacked chromatin DNA readily.</li>
    <li><strong>Ionic environment controls nuclear enzyme complement:</strong> Changing from buffer D to buffer A during isolation caused nuclei to exchange one set of bound enzymes for another — both nucleases and polymerases. The authors speculated this may relate to ionic changes occurring <em>in vivo</em> during the cell cycle.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper established the biochemical identity and properties of the Ca-Mg endonuclease — the enzyme that, in the companion paper, was shown to reveal chromatin substructure. The demonstration that it requires both Ca<sup>2+</sup> and Mg<sup>2+</sup>, has a MW of ~40,000 (possibly a dimer), and is specifically nuclear-associated, provided the enzymatic foundation for the structural discovery. The observation that ionic environment controls which enzymes associate with nuclei was an important insight about the dynamic nature of nuclear protein interactions.</p>
    <p><strong>Career significance:</strong> Together with the chromatin substructure paper, this forms a matched pair submitted simultaneously. The endonuclease paper provides the enzymological underpinning while the chromatin paper provides the structural revelation. The fact that the Ca-Mg endonuclease rises <em>after</em> DNA synthesis peaks (not during it) was an honest result that complicated any simple model of the enzyme's role in replication — but it was this very enzyme that proved to be the key to discovering chromatin substructure.</p>
