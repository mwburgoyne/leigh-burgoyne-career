    <li>Burgoyne, Waqar &amp; Atkinson (1970a,b): Discovery of Ca<sup>2+</sup>-dependent endonuclease in mammalian nuclei — the conceptual origin of the programme</li>
    <li>Hewish &amp; Burgoyne (1973a): Ca-Mg endonuclease characterisation</li>
    <li>Hewish &amp; Burgoyne (1973b): <strong>Chromatin substructure landmark paper</strong> (~1,172 citations)</li>
    <li>Burgoyne, Hewish &amp; Mobbs (1974): 2D PAGE analysis of chromatin fragments</li>
    <li><a href="1975_burgoyne_CaMg_endonuclease_Asites.html">Burgoyne &amp; Mobbs (1975)</a>: Quantitative A-site analysis of endonuclease action</li>
