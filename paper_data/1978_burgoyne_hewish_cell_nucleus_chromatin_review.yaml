sections:
- heading: Context & Background
  body_html: |-
    <p>By 1978, the nucleosome had become an established fact of molecular biology, confirmed by electron microscopy, biochemical cross-linking, and nuclease digestion studies across many laboratories worldwide. Burgoyne and Hewish had been at the centre of this revolution: their 1973 landmark paper (~1,172 citations) first demonstrated the regularly spaced chromatin substructure, and Kornberg's 1974 nucleosome model (Science 184, 868–871) explicitly cited their work as "the first such observation." This chapter, commissioned for Harris Busch's authoritative <em>The Cell Nucleus</em> series, gave Burgoyne and Hewish the opportunity to write the definitive account of their chromatin substructure programme — from the Ca-Mg endonuclease discovery through one-dimensional and two-dimensional gel electrophoresis analyses to the emerging evidence for higher-order nucleosome packing.</p><p>The chapter is notable for its intellectual honesty. Rather than presenting the chromatin substructure discovery as a straightforward scientific triumph, Burgoyne and Hewish openly explain that the work originated as a programme to study DNA replication control in mammalian nuclei, and the structural information emerged "fortuitously" when the Ca<sup>2+</sup>-dependent DNA synthesis system turned out to reflect chromatin organisation rather than replication control. This candid narrative of scientific serendipity — where a researcher follows the data rather than forcing it to fit the original hypothesis — is rare in review chapters and reveals much about Burgoyne's scientific philosophy.</p>
- heading: Key Content
  body_html: |-
    <ul>
    <li><strong>Classification of nuclear preparations:</strong> A systematic hierarchy of five subcellular DNA-synthesizing preparations, ranked from least to most degraded: (1) permealysed Ehrlich ascites cells (Burgoyne 1972), (2) Ficoll-D nuclei retaining both DNA polymerases, (3) Buffer A nuclei retaining only one polymerase, (4) amorphous chromatin preparations, (5) isolated DNA polymerases. Each preparation classified according to metabolic state of parent cell, degree to which it reflects that state, and structural modifications suffered during preparation.</li>
    <li><strong>Ca-Mg endonuclease properties summarised:</strong> MW ~30,000–40,000 daltons; absolute requirement for both Ca<sup>2+</sup> and Mg<sup>2+</sup>; selective for double-stranded DNA; nuclear-localised; found in mouse liver, rat liver, rat thymus, rat spleen, rabbit thymus, calf thymus; absent from chicken reticulocytes, rabbit bone marrow, and mouse ascites tumour. Inhibited by polyribo-ADP (synthesised from NAD by nuclear polymerase and covalently attached to the endonuclease). Level changes dramatically during liver regeneration.</li>
    <li><strong>One-dimensional gel electrophoresis:</strong> Reproduces and discusses the discrete DNA fragment ladder from the 1973 paper — bands whose molecular weights are integer multiples of a basic unit (~200 bp for double-stranded, ~100 bp for single-stranded). Extended the observation to mouse liver nuclei, rabbit bone marrow (using exogenous enzyme), and permealysed ascites cells. Cites the remarkably similar fragment pattern observed by Williamson (1970) in necrotic cell cytoplasm.</li>
    <li><strong>Two-dimensional gel electrophoresis:</strong> The 2D gel analysis from Burgoyne, Hewish &amp; Mobbs (1974) is explained in detail with a worked example (Fig. 6): a double-stranded fragment N nucleosomes long yields N classes of single-stranded fragments, confirming that each double-stranded class differs from the next by exactly one unit of length. Table I summarises the systematic relationship. This proof of regularly spaced sites was independent of accurate molecular weight determinations — an important methodological advantage.</li>
    <li><strong>Statistics of endonuclease attack:</strong> Reproduced the quantitative analysis from <a href="1975_burgoyne_CaMg_endonuclease_Asites.html">Burgoyne &amp; Mobbs (1975)</a>: (1) early-cleaved and late-cleaved internucleosomal sites are intimately intermingled, not clustered (P estimated two ways matches on 45° reference line); (2) double-strand break probability P<sub>ds</sub> ≈ P<sub>ss</sub><sup>2</sup>, meaning second-strand cleavage is statistically independent of first-strand cleavage. These results constrain models of higher-order chromatin packing.</li>
    <li><strong>Higher-order packing evidence — chromatin reprecipitation:</strong> Ghost-free soluble chromatin (one-third of internucleosomal bridges broken, extracted with pyrophosphate) formed almost perfect smooth spheres when reprecipitated by dialysis back into Buffer A. No membranes or internal structure visible. H1-free nucleoprotein (purified on agarose gel) still formed spherical bodies but as viscous liquid droplets rather than solid spheres. Conclusion: intrinsic chromatin–chromatin forces (nucleosome–nucleosome interactions with H1 as cross-linker) may explain gross nuclear structure without requiring an exogenous organiser or skeleton.</li>
    <li><strong>Comparison with other nucleases:</strong> Micrococcal nuclease gives equivalent results to Ca-Mg endonuclease at the internucleosomal level; DNase I is strongly blocked by higher-order chromatin packing in intact nuclei (referencing Burgoyne et al. 1976); DNase II attacks internucleosomal zones similarly but also cleaves at ~100 bp within nucleosomes (Altenburger et al. 1976); restriction endonucleases demonstrate nucleosomes are not sequence-positioned.</li>
    <li><strong>Prescient speculation on Ca-Mg endonuclease function:</strong> The authors propose the enzyme's "main natural function is to initiate a programmed nuclear destruction during necrosis in certain differentiated mammalian tissues" — connecting to the Williamson (1970) necrotic DNA ladder. This foreshadows by two decades the recognition that the Ca-Mg endonuclease-like DNA ladder is a hallmark of apoptosis, and directly anticipates Burgoyne's own 1999 pyknosis paper.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This is the authoritative review of the Burgoyne–Hewish chromatin substructure programme, written for what was the definitive book series on nuclear biology in the 1970s. It consolidates and contextualises findings from seven Burgoyne lab publications (1970–1977) into a single coherent narrative. The chapter does not present new experimental data, but it offers the most complete articulation of the intellectual trajectory from Ca<sup>2+</sup>-dependent DNA synthesis (1970) through endonuclease characterisation (1973) to chromatin substructure (1973) and higher-order packing (1975–1977). The classification system for nuclear preparations (Section II) and the statistical analysis of endonuclease attack patterns (Section IV.E) are presented here with greater clarity and detail than in the original papers.</p>
    <p><strong>Career significance:</strong> This chapter cemented Burgoyne and Hewish's standing as primary discoverers in the nucleosome field. Being invited to contribute to Busch's <em>The Cell Nucleus</em> placed them alongside the leading figures in chromatin biology. The chapter's frank discussion of how chromatin structure was discovered while studying something else — DNA replication control — captures Burgoyne's characteristic intellectual honesty. This is the last co-authored publication with Hewish, who completed his PhD thesis at Flinders in 1973 and published independently (Hewish 1977 in Nucleic Acids Research) by this time.</p>
