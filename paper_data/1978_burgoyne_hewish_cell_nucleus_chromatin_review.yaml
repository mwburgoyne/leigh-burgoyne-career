- heading: Key Collaborators
  body_html: |-
    <p><strong>D. R. Hewish</strong> — Co-author of the landmark 1973 chromatin papers and co-discoverer of the chromatin substructure. Hewish completed his PhD thesis at Flinders in 1973 and this is his last co-authored publication with Burgoyne, making it the valedictory document of their scientific partnership. Acknowledges Mrs. J. Mobbs (technical assistance, cited throughout the chapter's references). Work funded by the Australian Research Grants Committee and Flinders University Research Budget.</p>
