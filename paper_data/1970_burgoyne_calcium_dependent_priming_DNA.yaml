sections:
- heading: Context & Background
  body_html: |-
    <p>This paper marks Burgoyne's arrival at Flinders University and the beginning of a highly productive new research direction. Having moved from protein biochemistry (cytochrome b<sub>2</sub>, arom complex) to nuclear biology, Burgoyne joined forces with M. Anwar Waqar and his former Adelaide colleague Maurice R. Atkinson to investigate the fundamental question: what controls the initiation of DNA replication in mammalian nuclei? At the time, purified <em>E. coli</em> DNA polymerase was known to require nicked DNA with free 3′-hydroxyl ends as primers, but the mechanism of initiation in eukaryotic nuclei was unknown.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Intact nuclei have polymerase but no primer:</strong> Nuclei isolated from rat liver in Ca<sup>2+</sup>-free solutions contained active DNA polymerase (demonstrated by incorporation into added poly d(A-T) template) but could not synthesise DNA from their own high-molecular-weight nuclear DNA.</li>
    <li><strong>Ca<sup>2+</sup> triggers DNA nicking and priming:</strong> Addition of Ca<sup>2+</sup> immediately initiated DNA synthesis without added primer. Alkaline sucrose gradient analysis showed that Ca<sup>2+</sup> caused progressive nicking of nuclear DNA, reducing it from high molecular weight, with new DNA synthesis occurring on the nicked (smaller) DNA species.</li>
    <li><strong>Activated nuclei sustain synthesis:</strong> Nuclei briefly exposed to Ca<sup>2+</sup>/Mg<sup>2+</sup> then washed free of these ions ("activated nuclei") showed immediate incorporation of deoxyribonucleotides when provided with Mg<sup>2+</sup> and substrates. Omission of three of the four dNTPs reduced labeling only 2–3 fold.</li>
    <li><strong>Nearest-neighbour analysis confirms template-directed synthesis:</strong> Analysis showed covalent attachment adjacent to all four possible primer termini, ruling out terminal transferase activity as the source of incorporation.</li>
    <li><strong>araCTP as primer site titrant:</strong> The chain-terminating analog araCTP was incorporated only into activated (Ca<sup>2+</sup>-treated) nuclei, to a limited extent corresponding to "titration" of available primer termini. This provided an elegant measure of Ca<sup>2+</sup>-dependent primer site production.</li>
    <li><strong>Model proposed:</strong> A Ca<sup>2+</sup>-dependent endonuclease nicks nuclear DNA and provides 3′-hydroxyl termini that serve as primers for DNA polymerase. The authors note this effect "must be considered in any search for factors that control nuclear DNA synthesis in vivo."</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper introduces the concept of a Ca<sup>2+</sup>-dependent endonuclease in mammalian nuclei — an observation that would prove enormously consequential. While the paper frames the discovery in terms of DNA replication control, the Ca<sup>2+</sup>-dependent endonuclease described here is the same activity that, three years later, Hewish &amp; Burgoyne (1973) would show cuts chromatin at specific internucleosomal sites, producing the ladder pattern that was crucial evidence for the nucleosome model. This 1970 paper is thus the conceptual origin of one of the most important discoveries in chromatin biology.</p>
    <p><strong>Career significance:</strong> This is Burgoyne's first paper from Flinders University and marks his pivotal transition from protein biochemistry to nuclear DNA biology. The collaboration with Waqar (a skilled DNA biochemist) and Atkinson (who had been at Adelaide) established the research team that would produce a series of important papers on nuclear DNA synthesis. The choice to study nuclear DNA in intact nuclei rather than with purified components reflects Burgoyne's characteristic approach of studying biological systems in near-physiological conditions — an approach that would pay off spectacularly with the chromatin substructure discovery.</p>
