- heading: Key Collaborators
  body_html: |-
    <p><strong>M. Anwar Waqar</strong> — DNA biochemist at Flinders, key collaborator on the DNA synthesis programme. <strong>Maurice R. Atkinson</strong> — Senior biochemist, formerly at University of Adelaide (where he was co-author on Burgoyne's first paper), with connections to Arthur Kornberg's lab. <strong>Donna Staunton</strong> and <strong>Mario Froscio</strong> acknowledged for technical assistance — Froscio would become a long-term Burgoyne lab member.</p>
