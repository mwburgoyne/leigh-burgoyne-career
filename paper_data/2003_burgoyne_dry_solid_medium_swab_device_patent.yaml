- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Commercial development of the Whatman FTA swab product line for buccal and environmental sample collection</li>
    <li>Expansion of FTA technology into forensic casework beyond blood cards (crime scene swabs, reference buccal collections)</li>
    <li>Subsequent patents exploring additional matrix materials and form factors</li>
    <li>Widespread adoption in mass disaster victim identification programs using non-invasive buccal collection</li>
    <li>Clinical and veterinary diagnostic applications requiring swab-based sample collection with integrated DNA preservation</li>
