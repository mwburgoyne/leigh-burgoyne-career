sections:
- heading: Context & Background
  body_html: |-
    <p>By 2003, <mark>Burgoyne’s</mark> FTA technology had been protected by a long chain of continuation and continuation-in-part patents stretching back to the foundational US 5,496,562 of 1993/1996. The core dry solid medium concept — a solid matrix impregnated with a composition of weak base, chelating agent, anionic detergent, and optionally uric acid — was well established for filter paper applications. However, the practical challenge of collecting samples from surfaces, body orifices, and wounds required a physical form factor beyond flat paper cards. This patent introduced the swab device embodiment, extending FTA technology into a new product category. Assigned to Whatman, Inc. (the US subsidiary), this CIP patent added two co-inventors from the Whatman commercial team — Martin Smith and Neil Butt — reflecting the shift toward product engineering and commercial development.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Swab device form factor:</strong> A device comprising a support (handle/rod) and a head portion made of dry solid medium (FTA-impregnated matrix) for collecting, storing, and preserving genetic material directly upon contact with biological surfaces.</li>
    <li><strong>Polyester (PET) as preferred solid matrix:</strong> The patent specifically claims polyester material as the preferred matrix for the swab head — a significant departure from the cellulose-based papers of earlier FTA patents, enabling a new class of collection substrates.</li>
    <li><strong>Method claims for swab-based collection:</strong> Detailed method claims covering sorbing genetic material onto the swab, preserving it via the FTA chemistry, and releasing it (including by heat elution) for downstream analysis.</li>
    <li><strong>Cell lysis on-device:</strong> The patent claims the complete workflow of exposing the swab to a biological sample, sorbing cells, lysing them on the swab head to release genetic material, and then preserving the released DNA/RNA in situ.</li>
    <li><strong>Broad sample compatibility:</strong> Claims cover collection from buccal scrapes, blood, cerebrospinal fluid, feces, plasma, lymph, urine, cell/virus suspensions, and serum.</li>
    <li><strong>Multiplex PCR validation from PET-FTA swabs:</strong> Example 6 demonstrates complete STR profiles generated from buccal DNA collected on FTA-coated PET filter membrane swabs, validating the technology for forensic-grade analysis.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>US 6,627,226 represents a pivotal expansion of <mark>Burgoyne’s</mark> FTA technology from flat paper matrices to three-dimensional swab devices. This was commercially transformative: while FTA cards required the user to apply a sample (e.g., a blood drop) to the paper, the swab device enabled direct collection from mucosal surfaces, skin, wounds, and environmental surfaces. The introduction of polyester (PET) as a preferred matrix material was also technically significant — PET offered different sorption characteristics, mechanical properties, and the ability to be formed into woven bulbs, filters, and meshes suitable for swab heads. The patent’s Example 6 demonstrated that FTA-coated PET swabs could yield complete multiplex STR profiles from buccal scrapes, validating the technology for forensic human identification without requiring venipuncture. This patent enabled the commercial product line that became the Whatman FTA swab, widely adopted in forensic casework, mass disaster victim identification, and clinical diagnostics.</p>
