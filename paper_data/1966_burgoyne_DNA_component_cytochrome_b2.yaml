sections:
- heading: Context & Background
  body_html: |-
    <p>Crystalline yeast cytochrome b<sub>2</sub> contained 5–6% by weight of an apparently unusual low molecular weight DNA (b<sub>2</sub>-DNA). Previous work by Symons and others had shown this DNA was essential for formation of the characteristic square plate (Type I) crystals and was present in constant proportions. The question was whether this DNA was a biologically significant component of the enzyme or an artefact. This paper — with Burgoyne as first author — resolved that question definitively.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Size and structure selectivity, not sequence:</strong> Only double-stranded DNA of molecular weight ~2×10<sup>5</sup> could produce the characteristic square plate crystals. High molecular weight DNA, single-stranded DNA, and denatured DNA could not. Base composition was irrelevant: DNA from yeast, calf thymus, and <em>M. lysodeikticus</em> (ranging from 30% to 72% G+C) all worked when sonicated to the right size.</li>
    <li><strong>b<sub>2</sub>-DNA is a degradation product:</strong> Using RNA–DNA hybridisation (annealing experiments with <sup>32</sup>P-labelled yeast RNA), the authors showed that b<sub>2</sub>-DNA could hybridise with yeast RNA of all sizes (4S to 28S), far exceeding what would be expected if b<sub>2</sub>-DNA were a unique genetic element. This proved it was a random breakdown product of the whole yeast genome.</li>
    <li><strong>Confirmation by prevention:</strong> When fresh yeast was freeze-dried and processed rapidly (minimising DNA degradation), the resulting enzyme contained &lt;0.2% DNA and crystallised as hexagonal bipyramids (Type II, DNA-free form). Allowing the yeast to age restored normal Type I crystal formation.</li>
    <li><strong>Virus assembly model:</strong> The authors proposed the cytochrome b<sub>2</sub> system as a model for virus assembly, a protein selecting nucleic acid based on size and secondary structure, analogous to how viral coat proteins might select genomic nucleic acid during virion assembly.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper definitively resolved a longstanding puzzle in yeast enzymology. It also demonstrated that a protein could selectively bind nucleic acid based on physical properties (size, double-strandedness) independent of sequence, a concept relevant to understanding non-specific DNA–protein interactions that would become central to chromatin biology.</p>
    <p><strong>Career significance:</strong> This is Burgoyne's first paper as lead author, demonstrating independent thinking on DNA–protein interactions. The insight that proteins can select DNA by physical structure (not sequence) foreshadows his later chromatin work, where the relationship between DNA and histone proteins is governed by similar structural principles. The virus assembly analogy also shows early capacity for conceptual generalisation.</p>
