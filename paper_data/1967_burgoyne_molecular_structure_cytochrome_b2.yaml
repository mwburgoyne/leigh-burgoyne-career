sections:
- heading: Context & Background
  body_html: |-
    <p>This paper completes the cytochrome b<sub>2</sub> trilogy from Burgoyne's Adelaide period. Having shown that the DNA component was an artefact (1966) and that enzyme modification was required for crystallisation (1966), this paper used electron microscopy to determine the molecular architecture of both crystal forms, providing a structural explanation for why DNA of specific size and structure was selectively incorporated.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Molecular dimensions:</strong> Single enzyme molecule (MW 170,000) measured approximately 92 × 82 × 26 Å by negative staining and shadowing.</li>
    <li><strong>Type II (DNA-free) crystal structure:</strong> Hexagonal bipyramid crystals consisted of open hexagonal tubes of protein forming a honeycomb pattern when sectioned across the c-axis. Each side of a hexagon was one protein molecule, with three molecules meeting at 120° at each corner.</li>
    <li><strong>Type I (nucleoprotein) crystal structure:</strong> Flat square plate crystals showed parallel rows of protein molecules arranged as stacked layers, with alternate layers oriented at 90° to each other. DNA occupied the wider grooves between parallel protein rows.</li>
    <li><strong>DNA location model:</strong> Proposed that double-stranded DNA molecules sit in the wider grooves between protein rows, with narrow grooves empty. This model predicted 4.9% DNA content — matching the observed 5–6% almost exactly. Each DNA molecule (~650 Å long) spans about 14 rows of protein.</li>
    <li><strong>Virus assembly analogy refined:</strong> Concluded that the analogy to virus assembly was not fully satisfactory because nucleoprotein crystals are continuous structures whereas viruses are discrete complexes. The selectivity for double-stranded DNA reflects the requirement for linear (not self-cross-linked) molecules.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This was an early and elegant use of electron microscopy to resolve nucleoprotein crystal structure at near-molecular resolution. The observation that DNA organises protein layers in alternating 90° orientations provided a structural demonstration of how nucleic acid can fundamentally alter protein assembly, a concept with broad implications.</p>
    <p><strong>Career significance:</strong> This paper demonstrates Burgoyne's facility with structural biology techniques (EM, sectioning, negative staining) in addition to biochemistry. The structural thinking about how DNA and protein assemble together provided conceptual preparation for his later chromatin work, where DNA–histone organisation is the central question. This also represents Burgoyne's PhD thesis work (ref. 6 cites his 1967 Adelaide thesis).</p>
