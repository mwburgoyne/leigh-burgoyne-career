- heading: Key Collaborators
  body_html: |-
    <p><strong>David Edward Arnold Catcheside</strong> — School of Biological Sciences, Flinders University. Genetics researcher with expertise in DNA recombination and molecular biology.</p><p><strong>Kenneth Paul Kirkbride</strong> — Forensic Services, Australian Federal Police. Leading forensic chemist who provided operational context and drug seizure samples.</p><p><strong>Katrin Both</strong> — Forensic Science South Australia. Processed STR profiles from drug seizure extracts.</p><p><strong>James Waters</strong> — PhD student in <mark>Burgoyne’s</mark> laboratory whose thesis on soil DNA profiling provided foundational methodology.</p>
