sections:
- heading: Context & Background
  body_html: |-
    <p>This ground-breaking NDLERF-funded monograph represents the first instance worldwide of the isolation and profiling of DNA from illicit drug preparations. The underlying hypothesis was elegant in its simplicity: because illicit drugs are manufactured, “cut,” and distributed with no control over contamination, they are likely to contain traces of biological material — skin flakes, saliva, microbial cells, pollen, mould spores — all of which potentially contain DNA. If this DNA could be extracted and profiled, it could serve as an entirely new class of forensic evidence, linking apparently unrelated drug seizures or identifying individuals involved in the drug supply chain.</p><p>The project grew out of earlier PhD work in <mark>Burgoyne’s</mark> laboratory on soil DNA profiling, which had developed methods for comparing complex mixtures of environmental DNA using custom microarray technology and the proprietary ATNA-SMIPS amplification approach. <mark>Burgoyne</mark> and his collaborator Catcheside at Flinders University’s School of Biological Sciences partnered with Kirkbride from the Australian Federal Police’s Forensic Services division, creating a rare bridge between academic molecular biology and operational law enforcement.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>DNA can be extracted from drug seizures:</strong> Both human and non-human DNA sequences were successfully extracted and amplified from typical drug seizures of heroin, methamphetamine, and MDMA (ecstasy), even from quantities as small as 20 mg of powder.</li>
    <li><strong>Unexpected human DNA discovery:</strong> A reasonable proportion of seizures yielded partial human DNA profiles upon extraction, an unexpected finding that was arguably the most valuable outcome of the entire project. These profiles were compatible with the National Criminal Investigation DNA Database (NCIDD) and standard forensic STR profiling techniques.</li>
    <li><strong>Non-human DNA for seizure comparison:</strong> Non-human DNA (mainly microbial) was commonly present and could be compared pairwise between seizures using a novel two-colour fluorescent DNA microarray system with cy3 (green) and cy5 (red) labelling.</li>
    <li><strong>Microbial ecology of drugs:</strong> DNA sequences from seizures included skin commensals (<em>Propionibacterium acnes</em>, <em>Staphylococcus aureus</em>), soil bacteria (<em>Bacillus subtilis</em>, <em>Rhizobium</em>), plant pathogens (<em>Fusarium aywerte</em>), and environmental organisms, reflecting the “biological fingerprint” of the drug’s journey from manufacture to seizure.</li>
    <li><strong>Blocking non-informative sequences:</strong> Random hexamer-based blocking proved most effective at suppressing non-informative amplification artefacts (R² = 0.0207).</li>
    <li><strong>Tablet analysis:</strong> DNA was successfully extracted from MDMA tablets using a dilute sodium carbonate method, with approximately 50% of tablets yielding clearly observable DNA.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This monograph was a conceptual leap in forensic science — the idea that the biological “detritus” accumulated during the illicit drug manufacturing and distribution process could itself become forensic evidence was entirely novel. <mark>Burgoyne’s</mark> insight connected his longstanding expertise in DNA extraction technologies (including FTA paper) and environmental DNA profiling to a pressing law enforcement need. The work demonstrated that DNA profiling of drugs offers capabilities that chemical profiling cannot: specifically, it can identify <em>persons</em> involved in drug handling and can be applied to drugs that are difficult to profile by chemical means, such as “ice” (crystal methamphetamine). The project also advanced the concept of using microbial community DNA as a form of geographic “fingerprint” to infer drug provenance — an idea that anticipated the later explosion of metagenomics in forensics.</p>
