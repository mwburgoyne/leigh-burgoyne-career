- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Major synthesis of the Burgoyne chromatin superstructure programme (1975–1987)</li>
    <li>Most thorough published critique of solenoid/coil models from nuclease digestion evidence</li>
    <li>Extension of dinucleosome concept to human lymphoblasts and metaphase chromatin</li>
    <li>Demonstration that 2N pattern is specifically associated with condensed/metaphase chromatin</li>
    <li>Evidence that centromeric, interspersed, and active DNA sequences share the same higher-order packaging</li>
    <li>Back-to-back + face-to-face folding model as a full alternative to solenoid theories</li>
    <li>Foundation for the companion 1987 paper extending the disomal series to 16N</li>
    <li>Testori, Houck &amp; Burgoyne (1991, 1992) — chromatin accessibility studies connecting nuclease sensitivity to cell-cycle variation, extending the structural framework</li>
    <li>Burgoyne &amp; Bhakoo (1999) — pyknosis work connecting chromatin condensation and higher-order structural changes to apoptotic cell death</li>
    </ul>
  box_style: connections
