sections:
- heading: Context & Background
  body_html: |-
    <p>By 1976, the nucleosome as the basic repeating unit of chromatin was well established. The next frontier was understanding how nucleosomes are packed into higher-order structures. This paper shifts Burgoyne's focus from the nucleosome level to chromatin superstructure — using differential nuclease susceptibility as a probe. The key insight is that DNase I resistance reveals a level of organisation <em>above</em> the nucleosome: a fragile but highly protective packing arrangement. The paper also introduces an elegant pulse-labelling approach to follow the kinetics of chromatin maturation after DNA replication in regenerating rat liver. A. J. Marshall appears as a new collaborator.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Resting chromatin is highly resistant to DNase I:</strong> Over 90 min of DNase I digestion, only ~0.5% of DNA was rendered acid-soluble in intact nuclei. The bulk DNA remained &gt;800 bp. This is a near-total resistance at the genome level.</li>
    <li><strong>Trypsin destroys this resistance:</strong> When trypsin was added alongside DNase I, the DNA became rapidly and extensively degraded (~20% acid-soluble by 90 min). Trypsin removes histone H1 and modifies other histones, destroying the higher-order packing that protects against DNase I.</li>
    <li><strong>Calcium also destroys the resistance:</strong> Adding 1 mM Ca<sup>2+</sup> (replacing EGTA) dramatically increased DNase I susceptibility (~40% acid-soluble by 90 min), possibly via Ca-Mg endonuclease action, Ca<sup>2+</sup>-stimulated proteases, or direct effects on DNase I catalysis.</li>
    <li><strong>Micrococcal nuclease is NOT hindered by superstructure:</strong> In sharp contrast to DNase I, micrococcal nuclease attacked resting chromatin rapidly and trypsin had virtually no effect on its action. This means the superstructure specifically blocks DNase I (MW 31,000, ~41 Å diameter) but not micrococcal nuclease (MW 16,800, ~34 Å diameter) — suggesting a packing system with extremely uniform gap dimensions.</li>
    <li><strong>Newly synthesized chromatin is transiently DNase I susceptible:</strong> Using intraportal <sup>3</sup>H-thymidine pulse labelling in regenerating rat liver, newly synthesized chromatin (3.2 min post-pulse) was as susceptible to DNase I as trypsinised chromatin. This susceptibility decreased rapidly over ~10 min to the near-complete resistance of mature chromatin.</li>
    <li><strong>Three-stage maturation model proposed:</strong> Integrating with Weintraub's work on chick chromatin, Burgoyne proposed: (1) a very short initial DNase I-resistant phase (Weintraub), (2) a longer DNase I-susceptible phase (~3–10 min, this paper), (3) the final highly DNase I-resistant state of mature organised chromatin.</li>
    <li><strong>Size-exclusion model for superstructure:</strong> The differential susceptibility to DNase I vs micrococcal nuclease suggests nucleosomes are packed so that each protects its neighbours from molecules &gt;~41 Å but not from molecules &lt;~34 Å. This implies extremely uniform inter-nucleosome spacing in the higher-order structure.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper represents an important conceptual advance — moving beyond the nucleosome itself to ask how nucleosomes are packed in three dimensions. The differential nuclease susceptibility approach (DNase I vs micrococcal nuclease, +/− trypsin) was an elegant experimental strategy. The chromatin maturation kinetics experiment was technically demanding (intraportal labelling, rapid sacrifice, nuclear isolation) and provided one of the first direct measurements of higher-order chromatin assembly time after replication. The similarity to Seale's findings in HeLa cells (1975) indicated this was a general phenomenon.</p>
    <p><strong>Career significance:</strong> This paper marks the beginning of Burgoyne's sustained programme on chromatin higher-order structure that would continue through the 1980s. A. J. Marshall appears as a new collaborator — the first appearance of this name in the series. The paper also demonstrates Burgoyne's characteristic approach: using multiple enzyme probes on the same preparation to deduce structural features by differential sensitivity. Reference 1 cites Marshall &amp; Burgoyne (1976, same journal), indicating a companion paper.</p>
