sections:
- heading: Context & Background
  body_html: |-
    <p>By the mid-2000s, <mark>Burgoyne’s</mark> FTA technology had become the standard method for collecting and storing genetic material on solid media. However, a critical limitation persisted: high molecular weight genomic DNA does not release well from any medium. Human DNA consists of enormously long molecules that must be fragmented to a controlled, optimal size for reliable downstream applications such as DNA microarrays and multiple-well plate analytical systems used in SNP surveys. Existing methods for breaking DNA in coloured lysates — intense sound waves, mechanical methods, or chemical approaches — were each plagued by problems of safety, automation difficulty, contamination, or unreliability. This patent addressed that gap by introducing a photolysis-based method for controllably releasing DNA from FTA and other solid media after washing away interfering pigments.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Photolytic release method:</strong> A wash solution containing a buffer and a photolytic agent (preferably methylene blue) is applied to genetic-material-bearing solid media under dark or subdued light conditions. Subsequent controlled exposure to a light source releases DNA in fragments of defined, controllable size.</li>
    <li><strong>Controllable fragment size:</strong> Light exposure duration and photolytic agent concentration can be precisely tuned (down to microsecond intervals with a laser) to produce DNA fragments of optimal length for downstream applications, typically above 10 kilobases.</li>
    <li><strong>SDS as critical co-releasing agent:</strong> Sodium dodecyl sulfate in the wash solution was essential for efficient photolytic release; without SDS, even high concentrations of methylene blue with extended light exposure produced minimal DNA release.</li>
    <li><strong>Practical and safe:</strong> Methylene blue (NIH National Toxicology Program safety-assessed) with a conventional 8-watt fluorescent lamp and 10 minutes exposure sufficed for substantial DNA release.</li>
    <li><strong>Devices and kits:</strong> 51 claims covering devices (solid medium, light source, light-blocking cover) and kits for practicing the methods.</li>
    <li><strong>Broad applicability:</strong> Applies to FTA-coated materials, filter paper, silica with chaotropic agents, DNA-processing media with low positive charge, and any solid medium that binds genetic material.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This patent solved the persistent problem of controllable DNA release from solid media. While <mark>Burgoyne’s</mark> earlier FTA patents established methods for capturing, purifying, and storing DNA, this invention completed the workflow by providing a reliable, automatable, and safe method for releasing DNA in fragments of defined size. The photolytic approach was particularly well suited to robotic environments and high-throughput applications, as light exposure is simply programmable. This was essential for the emerging era of DNA microarrays and large-scale SNP genotyping, where controlled fragment sizes and high DNA concentrations were required for process repeatability. The patent extended the commercial utility of the Whatman FTA product line from a sample collection and storage platform to a complete sample-to-analysis pipeline. The methylene blue photolysis concept builds directly on the Seah &amp; <mark>Burgoyne</mark> (2001, 2003) work on photosensitizer-initiated attacks on dry DNA.</p>
