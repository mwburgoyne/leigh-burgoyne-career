  body_html: |-
    <p><strong>Norman H. Giles</strong> — Yale geneticist, head of the <em>arom</em> research programme. <strong>Mary E. Case</strong> — Long-term research associate. This paper represents the biochemical counterpart to the genetic work, with Burgoyne contributing the protein chemistry expertise.</p>
