    <ul>
    <li>First report of density-dependent actin regulation specific to AT cells</li>
    <li>Evidence that AT involves cytoskeletal/protein regulation abnormalities beyond DNA repair</li>
    <li>Foundation for the 1985 follow-up paper on the actin-derived protein in AT</li>
