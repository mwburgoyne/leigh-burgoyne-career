sections:
- heading: Context & Background
  body_html: |-
    <p>By 2014, the proof-of-concept conference paper by Khodakova, <mark>Burgoyne</mark>, Abarno &amp; Linacre (2013) had demonstrated that <mark>Burgoyne’s</mark> Seq5 single arbitrary primer could serve as a front-end for high-throughput soil metagenomic sequencing. This full-length <em>PLoS ONE</em> paper expanded the investigation into a rigorous head-to-head comparison of three random whole-metagenome sequencing approaches — shotgun, whole genome amplification (WGA), and arbitrarily primed PCR (AP-PCR) — for forensic discrimination of visually similar urban soils. Funded by the Attorney General’s Office of South Australia, the study addressed a critical gap: there was no validated method for comparing the DNA content of soils in forensic casework.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Three methods compared:</strong> Shotgun, WGA (Phi29 polymerase), and AP-PCR sequencing of triplicate soil samples from two Adelaide parklands ~3 km apart, using Ion Torrent PGM.</li>
    <li><strong>Shotgun and WGA failed:</strong> Both standard metagenomic approaches generated highly similar profiles across locations, with frequent misclassification in cross-validation of CAP models.</li>
    <li><strong>AP-PCR succeeded:</strong> The single arbitrary primer approach achieved 100% correct site-specific classification from class level upward across all taxonomic and metabolic hierarchies.</li>
    <li><strong>Thorough statistical validation:</strong> CLUSTER, SIMPROF, NMDS, and CAP analyses at all MG-RAST taxonomic and metabolic hierarchies confirmed AP-PCR superiority.</li>
    <li><strong>Dominant taxa:</strong> Proteobacteria, Actinobacteria, and Bacteroidetes comprised ~70% of annotated reads across all methods.</li>
    <li><strong>Subsampled datasets confirmed:</strong> RELATE analysis showed strong Spearman rank correlations (r &gt; 0.9) between full and subsampled (49,000 reads) datasets.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This paper is the definitive validation of <mark>Burgoyne’s</mark> arbitrarily primed PCR approach for forensic soil metagenomics, demonstrating for the first time that AP-PCR outperforms both shotgun and WGA-based sequencing for discriminating visually similar urban soils. The critical insight is that shotgun and WGA methods are dominated by highly similar abundant taxa, masking site-specific differences, while the single arbitrary primer acts as a pre-enrichment filter that targets both dominant and rare organisms equally. With ~49 citations, this is the most-cited paper from <mark>Burgoyne’s</mark> forensic soil metagenomics programme, representing the culmination of a research arc stretching from the 2004 SMIPS patent through the 2012 arbitrary primer validation to this systematic comparison.</p>
