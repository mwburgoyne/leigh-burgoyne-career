- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Established AP-PCR + HTS as the leading candidate method for forensic soil discrimination</li>
    <li>Roadmap for forensic validation: expanded geographic sampling, temporal variation studies, blind trials</li>
    <li>Open-access metagenomic datasets deposited on MG-RAST for community use</li>
    <li>Khodakova, <mark>Burgoyne</mark>, Abarno &amp; Linacre (2015) — temporal stability study demonstrating AP-PCR soil profiles are stable across seasons</li>
    <li><mark>Burgoyne</mark>, Koh &amp; Catcheside (2017, Methods in Molecular Biology) — formalised AP-PCR protocols for the wider community</li>
    <li><mark>Burgoyne</mark>, Koh &amp; Catcheside (2017, FSIGSS) — extended the approach to vehicle-surface DNA forensics</li>
    <li>Broader adoption of metagenomics-based forensic evidence frameworks</li>
