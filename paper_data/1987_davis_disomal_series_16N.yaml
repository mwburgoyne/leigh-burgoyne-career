sections:
- heading: Context & Background
  body_html: |-
    <p>This short communication in FEBS Letters is the companion paper to the comprehensive <a href="1987_drinkwater_chromatin_mixed_patterns.html">Drinkwater, Wilson, Skinner &amp; Burgoyne (1987)</a> Nucleic Acids Research study on chromatin mixed patterns (paper #27). While the NAR paper provided the broad structural framework and systematic critique of coil models, this paper delivers a focused experimental test: can the DNase I-generated disomal (2N) series be extended to its maximum using improved resolution techniques? The Burgoyne lab had previously tracked the 2N series to 10–12N using standard gel electrophoresis (Burgoyne &amp; Skinner 1982). Here, two technical advances — Klenow end-labelling with [<sup>32</sup>P]dATP (eliminating the overloading required for ethidium bromide staining) and field-inversion gel electrophoresis (FIGE, a recently developed technique for separating large DNA fragments) — are combined to push the resolution to its limit. S.J. Davis is a new first-author collaborator, not seen in previous Burgoyne lab papers. The correspondence address lists Davis, suggesting this may have been a student project or short-term collaboration.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Disomal series coherent to 16N:</strong> Using ferritin-DNase I probes on permeabilised chicken erythrocytes, the 2N series was clearly resolved up to the 16N level (i.e., fragments corresponding to 16 nucleosomes, ~3.2 kb) without any break in coherence or degeneration into a 1N series. This extends the earlier observation of 10–12N (Burgoyne &amp; Skinner 1982) by 4–6 orders.</li>
    <li><strong>No break in coherence predicted by coil models:</strong> Bridge-crossing coil models (e.g., Williams et al. 1986; Staynov 1983) predict that the disomal series should lose coherence at approximately 6N, where the first cyclic change in nucleosome exposure occurs as the coil completes its turn. No such break was observed at any point up to 16N.</li>
    <li><strong>No “coil signature” detected:</strong> If chromatin were organised as a regular coil, a preferentially generated class of fragments with a length equal to the coil cycle should appear. No such signature class was found, providing strong circumstantial evidence against regular coil models.</li>
    <li><strong>Technical advances enabling resolution:</strong> Two methods were critical: (1) Klenow fragment end-labelling with [<sup>32</sup>P]dATP allowed loading of only 75 ng DNA per lane (vs. micrograms for ethidium bromide), eliminating overloading artefacts; (2) field-inversion gel electrophoresis (FIGE) with ramped forward/backward fields provided superior separation of large fragments compared to standard electrophoresis.</li>
    <li><strong>Coiling models incompatible:</strong> To accommodate a coherent 2N series to 16N, bridge-crossing coil models would require at least 14–16 nucleosomes per turn, producing coil diameters considerably larger than the accepted 30 nm fibre width and requiring unreasonably long linker DNA.</li>
    <li><strong>Support for back-to-back double-stranded model:</strong> The authors propose that the data strongly support simple “back-to-back” double-stranded structures within chromatin — linear folds of DNA rather than coils — as the only model compatible with both the extended coherent disomal series and the absence of a coil signature.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper provides the strongest single piece of evidence against bridge-crossing coil models of the 30 nm chromatin fibre. By extending the coherent disomal series from 10–12N to 16N — well beyond the ~6N break point predicted by coil models — it eliminates a broad class of chromatin structure models. The simultaneous absence of a coil signature reinforces the argument. The result is parsimonious: only the back-to-back zigzag nucleofilament model, championed by the Burgoyne lab since 1981, can explain an indefinitely coherent 2N series without requiring implausible structural parameters. The adoption of FIGE technology (Carle, Frank &amp; Olsen 1986) for chromatin digestion analysis was methodologically novel.</p>
    <p><strong>Career significance:</strong> This is one of the last papers in Burgoyne’s Phase 3 chromatin superstructure programme (1975–1987). Together with the companion Drinkwater et al. 1987 NAR paper, it represents the culmination of the dinucleosome research line that began with the 1981 BBRC paper. S.J. Davis appears as first author — a new collaborator, likely a student or postdoc given the focused, short-communication nature of the work. Published in FEBS Letters, a rapid-communication journal, reflecting the paper’s sharp experimental focus. Funded by the Australian Research Grants Scheme.</p>
