  box_style: connections
- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Definitive extension of the disomal series to 16N, eliminating bridge-crossing coil models</li>
    <li>Strongest single argument from the Burgoyne lab against solenoid/coil models of the 30 nm fibre</li>
    <li>Companion to Drinkwater et al. 1987 NAR paper: together they form the climactic double publication of the chromatin superstructure programme</li>
    <li>Final support for the back-to-back zigzag nucleofilament model as the primary alternative to coil models</li>
    <li>Methodological introduction of FIGE and radiolabelling for high-resolution chromatin digestion analysis</li>
    <li>Marks the final publication in the probe-based dinucleosomal repeat series, though chromatin conformation themes continued in later work (1991-1992 phosphorylation studies, 1999 pyknosis paper, and beyond)</li>
    </ul>
  box_style: connections
