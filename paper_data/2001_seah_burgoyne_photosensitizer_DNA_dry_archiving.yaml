- heading: Context & Background
  body_html: |-
    <p>By 2001, Burgoyne’s FTA card technology was commercially deployed for forensic DNA databasing, newborn screening, and biodiversity sampling, with seven US patents granted. The Tris–urate chemistry embedded in FTA cards was specifically designed to protect DNA from free radical attack, but the mechanistic basis for this protection under dry conditions had not been rigorously investigated. Previous photosensitization studies had focused exclusively on DNA damage in aqueous environments. This paper addresses a fundamental question: what kinds of reactive species attack dry DNA, and can the Tris–urate formulation actually block them?</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Dry DNA damage differs fundamentally from aqueous:</strong> Under dry conditions, photosensitization produced high levels of strand breaks and AP (apurinic) sites but almost no 8-hydroxyguanine or formamidopyrimidines — the opposite profile from aqueous photosensitization, attributed to extremely low DNA hydration (3–4 water molecules per nucleotide vs. ~20 in B-form DNA).</li>
    <li><strong>Methylene blue damage is oxygen-dependent (type II):</strong> Strand breaks reduced ~5.8-fold and depurination ~18-fold in nitrogen atmosphere, indicating singlet oxygen-mediated mechanisms.</li>
    <li><strong>Riboflavin damage is oxygen-independent (type I):</strong> Not appreciably reduced in nitrogen, indicating direct electron/hydrogen transfer reaction. Oxygen partially quenched riboflavin damage.</li>
    <li><strong>Tris–urate provides strong protection:</strong> Reduced riboflavin strand breaks ~7.5-fold and methylene blue strand breaks ~17-fold compared to plain paper.</li>
    <li><strong>Attack mechanism is electrophilic:</strong> Protection by urate and caffeine (purine analogues with greater electron donor ability than DNA bases) indicated that free radical damage is electrophilic. Urate acts as a preferential target, intercepting reactive species before they reach DNA.</li>
    <li><strong>Novel in-situ microgel technique:</strong> Allowed assessment of DNA damage on paper without extraction, using plasmid supercoiling loss and repair enzyme probing (Fpg protein and exonuclease III).</li>
    <li><strong>Oxygen-independent pathways exist:</strong> At least one damage pathway operates without oxygen, meaning nitrogen storage alone is insufficient — chemical protectants are essential.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> First systematic mechanistic study of photosensitizer-initiated DNA damage under dry archival conditions. Revealed that dry-state damage chemistry is fundamentally different from aqueous systems. The finding that both oxygen-dependent (type II) and oxygen-independent (type I) pathways operate on dry DNA expanded understanding of archival degradation mechanisms.</p>
    <p><strong>Career significance:</strong> Provided direct mechanistic validation that the Tris–urate formulation in FTA cards effectively protects DNA from photosensitizer-initiated free radical cascades that model aging processes. Reinforced the scientific basis for FTA over simpler storage approaches by demonstrating that chemical protection, not just anaerobic storage, is essential for long-term DNA archiving.</p>
