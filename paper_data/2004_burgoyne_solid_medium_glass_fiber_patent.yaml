sections:
- heading: Context & Background
  body_html: |-
    <p>This 2004 patent application publication represents a continuation-in-part within the FTA patent family, tracing its lineage back to <mark>Burgoyne’s</mark> original 1988 Australian filing (PJ 0775). By this stage, FTA technology had been commercialised by Whatman, Inc. and was in wide use for forensic DNA collection, newborn screening programmes, and field-based sample archiving. This filing refined and broadened the claims, particularly by extending the solid matrix concept beyond cellulose-based filter paper to encompass glass fiber matrices — a significant materials innovation expanding the range of practical applications.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Fiber matrix with surfactant protection (Claim 1):</strong> A dry solid medium for DNA storage comprising a fiber matrix with a surfactant deposited onto it to protect applied genetic material from degradation.</li>
    <li><strong>Anionic detergent specification (Claim 2):</strong> The surfactant preferably includes an anionic detergent such as sodium dodecyl sulphate (SDS), the primary agent for denaturing proteins and inactivating pathogens.</li>
    <li><strong>Glass fiber matrix (Claim 3):</strong> Extension to synthetic glass fibers and filaments — encompassing wet-laid fiberglass microporous filters (Whatman GF/A, GF/B, GF/C, GF/D, GF/F grades) with pore sizes from 0.2 µm to 2.7 µm.</li>
    <li><strong>Releasing means (Claim 4):</strong> The medium further includes means for releasing the genetic material for downstream analysis.</li>
    <li><strong>Four-component protective composition:</strong> (i) monovalent weak base (Tris, pH 8.0–9.5); (ii) chelating agent (EDTA); (iii) anionic detergent (SDS); (iv) optionally uric acid as free-radical scavenger for long-term storage.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This patent application represented an important materials extension of the FTA platform. By broadening the claims from cellulose-based papers to glass fiber matrices, <mark>Burgoyne</mark> and Whatman secured intellectual property protection over a wider range of solid substrates for DNA storage. Glass fiber matrices offered advantages in controlled pore structure, reduced DNA adsorption losses, improved release characteristics, and compatibility with automated laboratory systems. The patent demonstrated successful PCR amplification of stored blood DNA targeting n-Ras proto-oncogene and Y-chromosome repeat sequences, with DNA quality equivalent to that from fresh blood.</p>
