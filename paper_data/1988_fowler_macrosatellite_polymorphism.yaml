- heading: Key Collaborators
  body_html: |-
    <p><strong>C. Fowler</strong> — Lead and corresponding author, driving the satellite III programme. <strong>R. Drinkwater</strong> — Continuing from 1986, cloning and sequence analysis. <strong>J. Skinner</strong> — Long-term collaborator, DNA preparation expertise. <strong>D. Callen</strong> (Adelaide Children’s Hospital) provided mouse/human hybrid cell panel. <strong>A. J. Jeffreys</strong> provided the 33.15 minisatellite probe. Funded by Channel 10 Children’s Medical Research Foundation SA and The Criminology Research Council ACT.</p>
