sections:
- heading: Context & Background
  body_html: |-
    <p>This paper represents the full characterisation of the satellite III polymorphism first reported in the 1987 Fowler et al. data note, introducing the concept of a “macrosatellite” polymorphism — a large-scale, complex polymorphism in tandemly repeating satellite DNA that is mechanistically distinct from the well-known minisatellites described by Alec Jeffreys. The work was set against the backdrop of explosive interest in DNA polymorphisms for human identification, with Jeffreys’ “DNA fingerprinting” having been published only three years earlier. The Burgoyne lab’s satellite DNA programme (from the 1986 satellite II paper onward) was now producing work with direct forensic implications.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>TaqI-specific complex polymorphism:</strong> Human satellite III DNA produces a complex, highly individual-discriminating banding pattern when digested with TaqI and probed with the satellite-III-related probe 228S. Each individual displayed 12–20 fragments in the 4–20 kb region.</li>
    <li><strong>Pure TTCCA pentamers are the key target:</strong> A synthetic oligonucleotide probe of pure TTCCA pentamers gave identical polymorphic patterns to the cloned 228S probe, demonstrating that hybridisation is driven by clusters of pure pentameric repeats.</li>
    <li><strong>Two-step point mutation mechanism:</strong> Polymorphism caused by sequential mutation: TTCCA → TTCGA (creating TaqI sites via C→G mutation), then CpG → TpG transition to TTTGA (destroying TaqI sites). This explains the TaqI specificity.</li>
    <li><strong>Autosomal K-domain localisation:</strong> Using a mouse/human hybrid cell panel, the polymorphism was mapped to K-domain autosomes, primarily chromosomes 9 and 15, with contributions from chromosomes 13, 14, 17, 20, 21, and 22.</li>
    <li><strong>Mendelian segregation:</strong> Family studies using Utah pedigrees confirmed orthodox Mendelian segregation.</li>
    <li><strong>Forensic applicability:</strong> Detectable from as little as 3 μg DNA with <sup>35</sup>S-labelled probe, suggesting forensic utility.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper coined the term “macrosatellite” polymorphism to describe a new category of DNA variation, distinct from Jeffreys’ minisatellites. The two-step point mutation decay mechanism (creating then destroying restriction sites within the degenerate TTCCA pentameric repeat) was a novel insight into satellite DNA evolution. The chromosomal mapping and family segregation studies provided the rigorous genetic validation needed for any forensic application.</p>
    <p><strong>Career significance:</strong> This is the pivotal paper consolidating the Burgoyne lab’s transition from chromatin structure to satellite DNA and forensic applications. The funding sources — Channel 10 Children’s Medical Research Foundation and The Criminology Research Council ACT — show a shift toward applied research. Jeffreys himself provided the 33.15 minisatellite probe for comparative analysis, indicating international recognition of this work. C. Fowler continues as the primary driver of the satellite III programme.</p>
