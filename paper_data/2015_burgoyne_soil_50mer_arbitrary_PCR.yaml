- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Established the 50mer condensation paradigm for cost-effective forensic metagenome comparison</li>
    <li>Proposed a pathway from discriminating 50mers to locality-specific PCR primer libraries for operational soil profiling</li>
    <li>Demonstrated mixture detection capability applicable to trace evidence contamination scenarios</li>
    <li>Provided a practical framework for forensic soil databases with modest storage requirements</li>
    </ul>
