sections:
- heading: Context & Background
  body_html: |-
    <p>By 2015, <mark>Burgoyne’s</mark> forensic soil metagenomics programme had matured through several generations of technology: from gel-based arbitrary primer PCR fingerprinting (SMIPS patent, 2004), through microarray-based sequence content profiling (Waters et al. 2012), to Ion PGM high throughput sequencing (Khodakova et al. 2013, 2014). While next-generation sequencing had proven capable of discriminating between soil metagenomes, the approach remained expensive, generating enormous datasets that demanded substantial computing. This conference paper, presented at the 26th ISFG Congress, introduces a radically economical approach: rather than comparing full metagenomic datasets, <mark>Burgoyne</mark> developed a method to condense each soil sample into a compact set of discriminating 50-base oligomer sequences. Notably, <mark>Burgoyne</mark> is the corresponding and first author — a return to direct intellectual leadership of the soil forensics line.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>50mer condensation method:</strong> From Roche GS FLX sequence data generated by single-primer (antiseq05) amplification, the most discriminating 50mers were selected based on sequence complexity — those approximating a random string with base frequency near 0.25, dinucleotide frequency near 0.0625, and minimal homopolymers or repeats.</li>
    <li><strong>Reproducibility:</strong> Duplicate samples from the same soil site produced scattergrams with clear linear relationships, confirming reproducibility within soil sampling heterogeneity.</li>
    <li><strong>Discrimination:</strong> Unrelated soils shared no 50mers — all data points fell on the axes of scattergrams. Related soils (one metre apart, or same spot six months later) shared 50mers but showed measurable divergence.</li>
    <li><strong>Temporal and spatial sensitivity:</strong> Soil metagenomes changed with both time and distance. By 37 months, much greater change was evident, though some 50mers persisted.</li>
    <li><strong>Mixture detection:</strong> Mixed soils from dissimilar origins produced distinctive overlay patterns, enabling detection of contamination or mixing.</li>
    <li><strong>Compact archival:</strong> The condensed 50mer datasets require archival space comparable to a digital image, making large-scale soil databases practical.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This paper represents <mark>Burgoyne’s</mark> most conceptually refined contribution to forensic soil metagenomics. Rather than simply throwing more sequencing at the problem, he addressed the fundamental bottleneck: how to make soil metagenome comparison fast, cheap, and intuitive enough for routine forensic use. The 50mer condensation approach reduces terabyte-scale metagenomic data to image-sized files that can be compared by simple scattergram visualisation. The method is deliberately knowledge-independent — it requires no prior information about the organisms present — and generates outputs intuitive for non-specialist forensic practitioners. The paper also introduced a path from 50mer identification to PCR primer design for locality-specific markers, pointing toward a library-based soil profiling system analogous to human STR databases.</p>
