sections:
- heading: Context & Background
  body_html: |-
    <p>Building on the laboratory’s decade of experience with avian repetitive DNA (Zhu, Skinner &amp; <mark>Burgoyne</mark>, 1990–1992), this paper asked a new question: when LINE retroelements insert into each other to form inverted repeat clusters, do these structures behave as species-specific markers? The work also demonstrated practical use of FTA paper for DNA sample storage from 16 avian species and multiple mammals.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>ILRCs form by sequential super-insertion:</strong> Avian CR1 LINE elements insert into one another to form inverted clusters with no host DNA between elements. Multiple CR1 subfamilies (48–82% homology) confirmed sequential retrotransposition events.</li>
    <li><strong>Species-characteristic patterns:</strong> Single-primer PCR across 14 avian species produced species-specific band patterns. Within species (20 Crested Pigeons, 20 Pelicans), ILRC sizes were conserved; between unrelated species, no shared sizes were found.</li>
    <li><strong>Closely related species share ILRCs:</strong> White-Winged and Superb Wrens shared most ILRC loci, with only one band unique to one species. Chicken breeds showed breed-specific bands alongside shared ones.</li>
    <li><strong>ILRCs decay by point mutation:</strong> Sequencing of a 183 bp ILRC from seven Crested Pigeons revealed accumulating point mutations. Present in 14 of 16 birds.</li>
    <li><strong>Mammalian L1 also forms ILRCs:</strong> Conserved species-specific ILRC patterns demonstrated in humans, rats, horse, cow, and cat.</li>
    <li><strong>Positive selection implied:</strong> High ratio of conserved to variant ILRCs across both bottlenecked and large populations argued against neutral drift alone.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>Identified a previously unrecognised class of conserved genomic structures — inverted LINE repeat clusters — that form by retrotranspositional super-insertion and spread rapidly to fixation within species. Proposed as a universal vertebrate species identification tool requiring only a single degenerate primer per LINE family. Connects <mark>Burgoyne</mark>’s earlier avian repetitive DNA work with practical forensic and conservation applications. All samples processed using FTA paper.</p>
