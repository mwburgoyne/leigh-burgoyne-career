- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>International discussion on optimal Y-STR multiplex size and composition for forensic casework, particularly in Southeast Asian populations.</li>
    <li>Practical guidance for forensic laboratories on integrating Y-STR testing into existing autosomal workflows.</li>
    <li>Population-specific Y-STR selection approaches for diverse ethnic groups.</li>
    <li><mark>Burgoyne’s</mark> continuing forensic DNA program at Flinders, reinforcing the laboratory’s reputation for applied forensic genetics.</li>
    </ul>
