- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li>Chang, Both, and <mark>Burgoyne</mark> (2002) — Genetic variation at three DYS-STR loci and amelogenin between Australian Caucasians and three Asian ethnic groups (J. Forensic Sci.), which established population frequency data for the same Y-STR loci.</li>
    <li>Foundational Y-STR research by Jobling, Kayser, and Tyler-Smith on forensic applications of Y-chromosome haplotyping.</li>
    <li><mark>Burgoyne’s</mark> broader forensic DNA program at Flinders, including FTA-based collection methods.</li>
    <li>Chelex extraction method (Walsh et al. 1991) and differential lysis techniques for forensic biology.</li>
    </ul>
