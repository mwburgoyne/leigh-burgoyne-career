sections:
- heading: Context & Background
  body_html: |-
    <p>By 2003, <mark>Burgoyne’s</mark> laboratory at Flinders University was deeply engaged in forensic DNA applications, building on years of work in DNA collection and analysis technologies. The forensic community was grappling with mixed male/female DNA profiles in sexual assault cases — a perennial challenge where standard autosomal STR multiplexes often produced ambiguous results. While the field was moving toward ever-larger Y-STR multiplexes with many loci, this paper took the contrarian position that a small, well-chosen triplex might actually outperform larger systems in practical casework. Graduate student Chang Yuet Meng led this work in collaboration with Katrin Both from the Forensic Science Centre in Adelaide, bridging <mark>Burgoyne’s</mark> academic laboratory with operational forensic practice.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Compact Y-STR triplex validated in real casework:</strong> A triplex consisting of DYS438, DYS390, and DYS439 was successfully applied to 13 evidentiary stains from two real sexual assault cases, demonstrating practical casework utility after initial autosomal profiling with the Profiler Plus multiplex.</li>
    <li><strong>Resolved mixed-source ambiguities:</strong> The Y-triplex established the minimum number of male contributors in four out of five multiple-source stains in Case 1 and confirmed suspect identities — information that autosomal STR profiling alone could not resolve due to shared alleles and partial profiles.</li>
    <li><strong>Superior sensitivity for low-template DNA:</strong> In Case 2, the Y-triplex detected a male profile even in a stain (N3) that was too weak to yield any autosomal STR profile.</li>
    <li><strong>Mechanistic advantages of small multiplexes:</strong> Four explanations for higher sensitivity: fewer compromises in cycling conditions, greater freedom in primer design, more productive PCR cycles (30 vs. 28), and more favorable primer-to-template ratios at haploid loci.</li>
    <li><strong>Complementary power with autosomal profiling:</strong> Combined use of the Y-triplex and autosomal multiplex yielded uniquely powerful discrimination — two suspects sharing the same Y-haplotype could still be differentiated via their autosomal profiles.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p>This paper made a practical and intellectually important argument: in forensic Y-STR typing, more loci are not always better. Because Y-chromosome loci are linked (inherited as a single haplotype), adding loci to a Y-multiplex yields diminishing returns in evidential value — unlike autosomal systems where each unlinked locus multiplies discriminatory power. Meanwhile, smaller multiplexes gain tangible advantages in sensitivity, robustness, and interpretability. By demonstrating this principle through real casework on challenging mixed-source stains from sexual assault investigations, the study provided a compelling case for the forensic community to adopt streamlined Y-STR systems as supplements to, rather than replacements for, autosomal profiling. The work also showcased <mark>Burgoyne’s</mark> laboratory as a bridge between academic genetics and real-world forensic practice in the Asia-Pacific region, with the triplex validated against 338 individuals from the Malaysian population.</p>
