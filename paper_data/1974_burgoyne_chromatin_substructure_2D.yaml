sections:
- heading: Context & Background
  body_html: |-
    <p>This paper is a direct follow-up to the landmark 1973 Hewish &amp; Burgoyne paper that first demonstrated the regular repeating substructure of chromatin. That paper showed the Ca-Mg endonuclease produced a discrete ladder of DNA bands from nuclei — bands whose molecular weights were integer multiples of a fundamental unit. This 1974 paper has two aims: (1) demonstrate that the phenomenon is not limited to rat tissues by extending it to mouse, and (2) use a novel two-dimensional electrophoresis technique to probe the internal (single-stranded) substructure of the DNA fragments. Jennifer Mobbs, previously acknowledged for technical assistance, is promoted to co-author.</p><p><strong>Publication anecdote:</strong> The manuscript had been submitted to the <em>Biochemical Journal</em> (received 30 January 1974) but was languishing with the editors. Francis Crick, who was working on a chromatin paper of his own at MRC Cambridge and wanted to cite this work, telephoned Burgoyne to ask when it would be published. When Leigh told him the paper was stuck with the journal editors, Crick apparently contacted the journal himself — because the next day Leigh was informed the paper had been accepted. Crick's forthcoming paper is listed as reference 38 in the <a href="1974_kornberg_chromatin_repeating_unit_nucleosome.html">Kornberg (1974)</a> nucleosome model paper: “R. D. Kornberg, A. Klug, F. H. C. Crick, in preparation.”</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Chromatin substructure is conserved across species:</strong> Mouse liver nuclei produced the same discrete DNA ladder as rat liver nuclei, with very similar band mobilities. The fundamental regularity of chromatin substructure is not rat-specific but a general mammalian feature.</li>
    <li><strong>Novel 2D electrophoresis method developed:</strong> Burgoyne developed a two-dimensional system exploiting the fact that 7M urea does not denature native DNA but prevents renaturation after heat treatment. First dimension: native DNA separation in 2.5% acrylamide/7M urea. Between dimensions: boiling in 7M urea to denature. Second dimension: denatured DNA separation in 7.5% acrylamide/7M urea.</li>
    <li><strong>Each native band contains a regular series of single-stranded fragments:</strong> The smallest native band (band 1) yielded one denatured class (A). Band 2 yielded two classes (A, B). Band 3 yielded three classes (A, B, C). Band 4 yielded four (A, B, C, D). This is the key result — an integral relationship between native and denatured fragment sizes.</li>
    <li><strong>Double-strand series arises from single-strand breaks:</strong> The 2D analysis demonstrated that the regular double-stranded fragment series is a <em>secondary consequence</em> of a regular pattern of single-strand breaks. Single-strand breaks are much more frequent; double-strand breaks occur where two single-strand nicks are close together.</li>
    <li><strong>Fragments are genuine, not concatenates:</strong> The 2D gel proved that higher-order bands were not merely hydrogen-bonded concatenates of smaller species. The zone above the expected diagonal (where concatenates would appear) was virtually free of DNA.</li>
    <li><strong>Molecular weight determinations:</strong> Using neutral and alkaline sucrose gradients combined with PAGE, the smallest double-stranded class had MW ~120,000–150,000 (s<sub>20,w</sub> = 5.3 S) and the smallest single-stranded class had MW ~45,000–63,000 (s<sub>20,w</sub> = 3.8 S) — approximately half, as expected for denatured DNA.</li>
    <li><strong>Two levels of steric hindrance proposed:</strong> The primary level produces the regular pattern of single-strand susceptible sites. A secondary, more random level of steric hindrance (from other nucleoproteins) modulates the time-course of degradation of higher-order bands. This two-level model provides a basis for understanding chromatin higher-order structure.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This paper significantly strengthened the chromatin substructure model from the 1973 landmark paper. By demonstrating the phenomenon in mouse as well as rat, Burgoyne showed it was a general mammalian feature. The innovative 2D electrophoresis method revealed that the mechanism of DNA fragmentation was primarily through single-strand nicking at regularly spaced sites, with double-strand breaks being a statistical consequence. This deepened understanding of how proteins are arranged on DNA and anticipated the nucleosome model that Kornberg would propose later in 1974. The two-level steric hindrance model foreshadowed the concept of higher-order chromatin organisation.</p>
    <p><strong>Citation impact:</strong> 142 citations — very strong for a detailed methodological/mechanistic follow-up paper. Together with the 1973 landmark (~1,172 citations) and the 1973 endonuclease characterisation (~126 citations), this establishes a trio of papers totalling ~1,440 citations on the chromatin substructure discovery.</p>
