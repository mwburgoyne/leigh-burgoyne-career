- heading: Knowledge Built Upon
  body_html: |-
    <ul>
    <li><strong>Burgoyne US 5,496,562 (1994/1996):</strong> Foundational FTA solid medium patent — chemistry of DNA storage on treated cellulose paper</li>
    <li><strong>Kostman et al. (1995) <em>J. Infect. Dis.</em>:</strong> PCR ribotyping method using 16S–23S intergenic spacer amplification — the typing methodology adopted in this study</li>
    <li><strong>Belgrader, Del Rio, Marino &amp; Williams (1995) <em>Biotechniques</em>:</strong> Validation of FTA technology for blood DNA — the key precedent demonstrating FTA card efficacy</li>
    <li><strong>Burgoyne et al. (1994) 5th Intl Symp Human Identification:</strong> Conference presentation establishing FTA in the forensic community</li>
    </ul>
