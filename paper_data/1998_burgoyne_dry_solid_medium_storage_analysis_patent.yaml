- heading: Key Collaborators
  body_html: |-
    <p><strong>Leigh Alexander Burgoyne</strong> — Sole inventor. This patent, like its parent, reflects Burgoyne's individual conceptual development of the FTA platform, extending it from passive storage to active analytical capability. The sole inventorship across multiple patents in the family underscores his singular role in conceiving and developing FTA technology. Assignee: Flinders Technologies Pty. Ltd., Australia.</p>
