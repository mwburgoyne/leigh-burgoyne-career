    <li><strong>Earlier:</strong> <a href="1971_chalmers_preformed_purines_lymphoid.html">Chalmers, Atkinson, Burgoyne &amp; Murray (1971)</a> — first Murray–Burgoyne collaboration on purine metabolism in lymphoid tissue</li>
    <li><strong>Later — PKC-chromatin programme:</strong> <a href="1988_testori_DNA_binding_PKC.html">Testori, Hii, Fournier, Burgoyne &amp; Murray (1988)</a> — DNA-binding proteins co-purifying with protein kinase C; <a href="1991_testori_phosphorylation_chromatin_HL60.html">Testori, Cahill &amp; Burgoyne (1991)</a> — phosphorylation of chromatin-associated proteins in HL-60 cells; <a href="1992_testori_substrate_conformation_PKC.html">Testori, Cahill &amp; Burgoyne (1992)</a> — substrate conformation and PKC activity. These papers brought together Murray's interest in PKC (an enzyme activated by tumor promoters like TPA) and <mark>Burgoyne</mark>'s chromatin expertise.</li>
    <li><strong>Phase 3 chromatin work:</strong> <mark>Burgoyne</mark>'s ongoing chromatin superstructure research (1975–1992) provided the intellectual backdrop for understanding how cell-surface signals like tumor promoters might ultimately affect nuclear organisation</li>
    </ul>
  box_style: connections
- heading: Key Collaborators
  body_html: |-
    <p><strong>Andrew W. Murray</strong> — Professor, School of Biological Sciences, Flinders University. Long-standing colleague of <mark>Burgoyne</mark>'s; specialist in phorbol ester biochemistry, protein kinase C, and purine metabolism. Co-author on Chalmers et al. (1971) and the Testori et al. series (1988–1992). <strong>D. James Fitzgerald</strong> — Postdoctoral researcher with Murray at Flinders; went on to a distinguished career in tumor promotion and gap junction research.</p>
