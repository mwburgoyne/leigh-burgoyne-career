sections:
- heading: Context & Background
  body_html: |-
    <p>This paper was produced during Leigh Burgoyne's early career at the University of Adelaide, supported by a Nuffield Foundation research scholarship, working under R. H. Symons in the Departments of Agricultural Biochemistry and Biochemistry. Yeast cytochrome b<sub>2</sub> (L-lactate dehydrogenase, EC 1.1.2.3) had been crystallised by Appleby &amp; Morton in the 1950s, but the relationship between the crystalline enzyme and the native intracellular form was poorly understood. Labeyrie &amp; Slonimski had noted kinetic changes during purification but the mechanism was unexplained.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Single native form:</strong> Soluble and particulate fractions of yeast L-lactate dehydrogenase were shown to be identical by starch gel electrophoresis, supporting the conclusion that yeast contains a single molecular species of this enzyme.</li>
    <li><strong>Modification during purification:</strong> On storage at 4°C after partial purification, the enzyme underwent progressive changes: the Michaelis constant (K<sub>m</sub>) for L-lactate increased (from 0.6 mM to 1.7 mM with ferricyanide; from 0.08 mM to 0.5 mM with cytochrome <em>c</em>), electrophoretic mobility increased, and multiple bands appeared.</li>
    <li><strong>Modification is prerequisite for crystallisation:</strong> Using <sup>35</sup>S-labelled enzyme, the authors demonstrated that previously crystallised enzyme preferentially re-crystallised from mixtures with unmodified enzyme, proving that the conformational modification must precede crystallisation. Butanol saturated solutions prevented both the modification and crystallisation.</li>
    <li><strong>DNA involvement:</strong> The paper also identified that partial breakdown of high molecular weight DNA during purification was a second, independent prerequisite for crystallisation, an early observation of DNA–protein interactions that foreshadowed Burgoyne's later career focus.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> This was one of the earliest demonstrations that enzyme crystallisation can involve artefactual modification of the native protein, a cautionary finding for the broader enzymology community. It highlighted that crystalline enzyme preparations, widely used as "pure" reference standards, may not represent the physiological form.</p>
    <p><strong>Career significance:</strong> This is among Burgoyne's earliest publications, produced during his postgraduate work at Adelaide. The observation of DNA's role in the crystallisation process represents an early intersection with nucleic acid biochemistry that would become central to his subsequent career.</p>
