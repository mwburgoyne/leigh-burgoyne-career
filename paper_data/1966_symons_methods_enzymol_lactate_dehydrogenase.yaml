sections:
- heading: Context & Background
  body_html: |-
    <p>Methods in Enzymology is one of the most widely referenced series in biochemistry, providing definitive protocols for enzyme preparation. This chapter established the standard preparation procedure for crystalline yeast cytochrome b<sub>2</sub>, incorporating the modifications developed by Symons and Burgoyne at Adelaide. It represents the codification of their collective work on this enzyme system into the canonical reference form.</p>
- heading: Key Content
  body_html: |-
    <ul>
    <li><strong>Complete purification protocol:</strong> Detailed 7-step procedure from dried yeast to three-times-crystallised enzyme, including extraction with butanol-lactate, four sequential acetone fractionations, and crystallisation by dialysis. Yields 25–50 mg of purified enzyme (specific activity ~140 units/mg) from 1 kg of dried yeast.</li>
    <li><strong>Assay methods:</strong> Ferricyanide reduction assay at 420 nm; also applicable to whole yeast using butanol permeabilisation.</li>
    <li><strong>DNA-free enzyme preparation:</strong> Method for preparing Type II (DNA-free) enzyme via DEAE-cellulose chromatography, yielding hexagonal bipyramid crystals distinct from the square plate Type I crystals.</li>
    <li><strong>Oxidised enzyme preparation:</strong> Sephadex G-75 procedure for removing lactate substrate to obtain oxidised cytochrome b<sub>2</sub>.</li>
    <li><strong>Physical and spectral properties:</strong> Detailed reference data including molecular weight (80,000 per protoheme), sedimentation coefficients, absorption spectra, substrate specificity, and inhibitor profiles.</li>
    <li><strong>Crystallisation artefact noted:</strong> Explicitly states that the DNA component is "probably an artifact of the crystallization procedure," citing the companion research papers.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> As a Methods in Enzymology chapter, this became the standard reference protocol for anyone working with yeast cytochrome b<sub>2</sub>. These chapters are the "gold standard" for enzyme preparation and are among the most cited items in biochemistry.</p>
    <p><strong>Career significance:</strong> Being invited to contribute a Methods in Enzymology chapter as a junior researcher (Burgoyne was still early career) indicates the quality and impact of the Adelaide cytochrome b<sub>2</sub> work. It also demonstrates practical experimental skill, a characteristic that would define Burgoyne's career through to the development of FTA cards.</p>
