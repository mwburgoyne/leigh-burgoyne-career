sections:
- heading: Context & Background
  body_html: |-
    <p>This comprehensive PCT application is a continuation-in-part of the foundational FTA solid medium patent (US 5,496,562). While the original patent covered the chemistry of DNA storage on treated filter paper, this patent builds an entire integrated system around it — covering automated fluid handling (the cannula), sample purification (gel-based PCR cleanup), and high-throughput sample management (the Punch Technology System). The patent represents the transition from a laboratory invention to an industrialised product platform, with two US-based co-inventors (Williams and Marino) reflecting the growing American commercial partnership. The patent explicitly references the UK national DNA database initiative (Nature 370:588, Aug 25, 1994), demonstrating the direct connection between FTA technology and forensic DNA databasing.</p>
- heading: Key Claims & Innovations
  body_html: |-
    <ul>
    <li><strong>Section I — Solid medium for DNA storage:</strong> Incorporates and extends the original solid medium patent. Same composition (Tris, EDTA, SDS, optional uric acid) on cellulose-based paper. DNA can be used in situ (PCR, restriction digestion) without removal from the matrix. Demonstrated with Amplitype DQα, Amplitype PM, and GenePrint STR (THO1) systems — the standard forensic DNA typing kits of the mid-1990s.</li>
    <li><strong>Section II — The cannula:</strong> A novel pipette/cannula design for automated fluid delivery systems (AFDS) that overcomes the critical problem of solid material blocking conventional pipette tips. Features a primary fluid port and at least one auxiliary port, geometrically arranged so a single solid particle cannot simultaneously block both ports. Multiple embodiments described: inverted-V notches along the shaft (saw-tooth profile), porous frit end-cap (spherical geometry), and perpendicular orifice designs. Designed for use with ROSYS 3300 robotic systems.</li>
    <li><strong>Section III — Biopolymer purification apparatus:</strong> A polyacrylamide gel block with micro-wells for PCR cleanup. Low molecular weight by-products (salts, primers, dNTPs) diffuse out of the wells into the gel by passive diffusion (no electric field), while large biopolymers (DNA) remain trapped in the wells due to their effective molecular volume. Cross-linkage controls the size cutoff. Enables automated cleanup for capillary electrophoresis. Wells ~4 mm diameter, 4–6 mm deep.</li>
    <li><strong>Section IV — Punch Technology System (PTS):</strong> An integrated system for high-throughput processing of DNA samples stored on solid media (FTA cards). Components: (a) Identification station with barcode reader; (b) Tracking station with card sample locator (CSL) and punch mechanism; (c) Processing station with automated fluid delivery. The punch mechanism (circular blade, ~4 mm diameter, like a skin biopsy punch) cuts a disc from the FTA card and places it in a receiving container (microtiter plate well, Eppendorf tube, PCR tube). Heat sterilisation of the blade between samples (~275°C) prevents cross-contamination. System can process 2–2,000+ samples.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific and commercial contribution:</strong> This patent transforms the FTA card from a simple storage medium into a complete sample-to-result platform. The Punch Technology System became the basis of the commercial FTA product line — the disc-punching approach to sampling from FTA cards became standard practice in forensic laboratories worldwide. The cannula design solved a real engineering problem (pipette blockage by solid material in automated systems) that was critical for making FTA-based workflows compatible with laboratory robotics. The gel-based PCR cleanup anticipated the need for automated post-PCR processing that became essential with the adoption of capillary electrophoresis for STR typing. Together, these innovations enabled the high-throughput forensic DNA databasing that the UK and other countries were initiating in the mid-1990s.</p>
    <p><strong>Career significance:</strong> This is the first patent with co-inventors — Patrick E. Williams and Michael A. Marino, both US-based, indicating international collaboration and likely partnership with a US-based forensic/biotechnology company. The Burgoyne address has changed from Seaford to Mitcham (both in Adelaide). The patent's scope — covering solid medium, fluid handling, purification, and sample management — reflects the evolution from a single invention to an entire technology platform. The explicit reference to the UK DNA database (1994) shows Burgoyne's awareness that FTA technology was positioned to enable a transformative application in criminal justice.</p>
