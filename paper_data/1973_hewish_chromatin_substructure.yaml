- heading: Key Collaborators
  body_html: |-
    <p><strong>Dean R. Hewish</strong> — First author. Flinders University. Hewish first appears in the Burgoyne publication record via Wallace, Hewish, Venning &amp; Burgoyne (1971). Reference 7 ("Hewish, D.R. and Burgoyne, L.A., in preparation") indicates a companion paper on the Ca-Mg endonuclease characterisation was being prepared concurrently. <strong>Mrs. J. Mobbs</strong> acknowledged for technical assistance (as in the 1972 sole-author paper).</p>
