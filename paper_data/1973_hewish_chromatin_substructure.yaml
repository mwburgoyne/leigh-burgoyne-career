- heading: What It Contributed To
  body_html: |-
    <ul>
    <li><strong><a href="1974_kornberg_chromatin_repeating_unit_nucleosome.html">Kornberg (1974)</a>:</strong> Nucleosome model — proposed the chromatin subunit as ~200 bp DNA wrapped around a histone octamer (Science 184, 868). Cited Hewish &amp; Burgoyne.</li>
    <li><strong>Olins &amp; Olins (1974):</strong> Visualisation of "nu bodies" — beads-on-a-string electron microscopy (Science 183, 330). Cited Hewish &amp; Burgoyne.</li>
    <li><strong>Noll (1974):</strong> Micrococcal nuclease ladder confirming ~200 bp repeat (Nature 251, 249). Cited Hewish &amp; Burgoyne.</li>
    <li>The entire field of chromatin biology and epigenetics</li>
    <li>Hewish &amp; Burgoyne's own subsequent work on chromatin structure (1974 onward)</li>
    <li>Textbook accounts of chromatin structure discovery (e.g., Alberts et al., Molecular Biology of the Cell)</li>
    <li>Burgoyne's dinucleosome repeat and zigzag chromatin folding model (1981–1987), extending the subunit concept to higher-order architecture</li>
    <li>Foundational understanding of chromatin that informed later applied DNA work, including FTA card development and the 2025 macrofungi DNA extraction protocol</li>
    </ul>
