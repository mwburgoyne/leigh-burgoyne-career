landmark: true
landmark_html: |-
  <p><strong>Historical significance:</strong> This paper provided the first experimental evidence that chromatin has a repeating subunit structure. By showing that an endogenous nuclear endonuclease digests chromatin DNA at regularly spaced sites — producing a discrete ladder of DNA fragments whose molecular weights are integer multiples of the smallest unit — Hewish and Burgoyne demonstrated that the DNA–protein complex of chromosomes is not a random aggregate but has a periodic architecture. This observation preceded and directly informed Roger Kornberg's nucleosome model (1974), the Olins &amp; Olins "nu body" visualisation (1974), and Markus Noll's micrococcal nuclease ladder (1974). Kornberg received the 2006 Nobel Prize in Chemistry for his work on the molecular basis of eukaryotic transcription, which built upon the understanding of chromatin structure that began with observations like this one.</p>
