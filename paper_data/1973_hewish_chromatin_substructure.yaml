sections:
- heading: Context & Background
  body_html: |-
    <p>This paper represents the convergence of Burgoyne's entire preceding research programme. The Ca<sup>2+</sup>-dependent endonuclease discovered in the 1970 papers (Burgoyne, Waqar &amp; Atkinson) had been characterised as a tool for studying nuclear DNA synthesis. But Hewish and Burgoyne recognised a far more profound application: using this enzyme as a structural probe. Because the Ca-Mg endonuclease could attack nuclear DNA <em>in situ</em> — unlike other cellular nucleases — it could reveal the arrangement of proteins on the DNA. The key insight was that if histones were positioned regularly along the DNA, the nuclease would be restricted to cutting at the gaps between protein-bound regions, producing DNA fragments of predictable, regular sizes.</p>
- heading: Key Findings
  body_html: |-
    <ul>
    <li><strong>Discrete DNA ladder from nuclear digestion:</strong> When rat liver nuclei were incubated with Ca<sup>2+</sup> and Mg<sup>2+</sup> to activate the endogenous Ca-Mg endonuclease, the extracted DNA showed a series of discrete bands on polyacrylamide gel electrophoresis (at least 6 bands visible). The bands increased in intensity initially but reached a stable limit pattern.</li>
    <li><strong>Molecular weights are integer multiples:</strong> When the square root of mobility was plotted against band number (log scale), the points fell on a straight line — demonstrating that the fragment molecular weights formed a series of exact multiples of the smallest unit. This is the hallmark of a repeating structural unit.</li>
    <li><strong>Bands are not artefactual concatenates:</strong> Individual bands eluted from gels and rerun migrated with their original mobility, proving the larger species are genuine covalent DNA fragments, not loose aggregates of smaller pieces.</li>
    <li><strong>Naked DNA does not produce bands:</strong> When the same Ca-Mg endonuclease (extracted from nuclei) was used to digest protein-free calf thymus DNA or rat liver DNA, only a continuous smear was produced — no discrete bands. This proved the regular pattern arises from the protein–DNA structure, not from sequence specificity of the enzyme.</li>
    <li><strong>Pancreatic DNase I does not produce bands from nuclei:</strong> DNase I acting on isolated nuclei (with Ca-Mg endonuclease suppressed by EGTA) produced only a continuous smear, demonstrating the Ca-Mg endonuclease has unique specificity for chromatin structure.</li>
    <li><strong>Proposed repeating substructure model:</strong> The authors proposed that "chromatin has some simple, basic, repeating substructure with a repetitive spacing of sites that are potentially accessible to the Ca-Mg endonuclease" — with some sites sterically blocked by "superstructure proteins," producing fragments that are all multiples of the basic repeat distance. This is essentially a description of what would soon be called the nucleosome.</li>
    </ul>
- heading: Significance & Contribution
  body_html: |-
    <p><strong>Scientific contribution:</strong> With ~1,172 citations, this is by far Burgoyne's most influential paper and one of the key foundational papers in chromatin biology. The discrete DNA ladder produced by endogenous nuclease digestion was the first direct experimental evidence for a repeating subunit in chromatin. Within 18 months of this publication, Roger Kornberg proposed the nucleosome model (Science, 1974), the Olins visualised "nu bodies" by electron microscopy (Science, 1974), and Markus Noll reproduced the ladder with micrococcal nuclease and determined the repeat length at ~200 bp (Nature, 1974). All three groups cited Hewish &amp; Burgoyne. The paper is regularly cited in textbook accounts of the discovery of the nucleosome.</p>
    <p><strong>Methodological elegance:</strong> The experimental logic is exceptionally clean. Three critical controls establish the conclusion: (1) the same enzyme on naked DNA produces no bands (regularity comes from protein arrangement, not enzyme specificity); (2) a different enzyme (DNase I) on nuclei produces no bands (the Ca-Mg endonuclease has unique access to the inter-subunit sites); (3) re-electrophoresis of isolated bands confirms they are genuine discrete species. This constitutes a compelling argument with minimal data.</p>
    <p><strong>Career significance:</strong> This is the culminating paper of Burgoyne's DNA synthesis programme. The Ca<sup>2+</sup>-dependent endonuclease, initially studied as part of the DNA replication/repair system (1970–1972), here reveals its true importance as a structural probe. The intellectual trajectory from "Ca<sup>2+</sup> stimulates DNA synthesis by creating primer sites" to "the nuclease that creates those sites cuts at regularly spaced points in chromatin" represents a remarkable example of following unexpected observations to transformative conclusions. Hewish is first author, indicating he likely performed the key experiments, but the nuclease system and nuclear isolation methodology were developed by Burgoyne and his group over the preceding three years.</p>
