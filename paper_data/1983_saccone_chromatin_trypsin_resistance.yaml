- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Identification of histone H<sub>3</sub> as critical for chromatin superstructure maintenance</li>
    <li>Extension of size-selective probe approach from nucleases to proteases</li>
    <li>Constraint on solenoidal/chromatin fibre models: initial protease attack in cavities &gt;4–5 nm</li>
    <li>Evidence that H<sub>1</sub>/H<sub>5</sub> and H<sub>3</sub> form an intimately associated class in chromatin organisation</li>
