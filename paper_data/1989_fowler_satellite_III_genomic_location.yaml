- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Revised genomic mapping of the satellite III macrosatellite polymorphism to chromosomes 20, 21, 22</li>
    <li>Understanding of TDPS as very recently amplified, homogeneous TTCCA blocks</li>
    <li>Evidence for extremely low transposon invasion of centromeric heterochromatin</li>
    <li>Refinement of the point-mutation-decay model for satellite III polymorphism</li>
    <li>Foundation for the companion 1989 phylogeny paper comparing satellite DNA across higher primates</li>
    <li>Forensic DNA methodology: defining which chromosomal regions contribute to individual identification</li>
