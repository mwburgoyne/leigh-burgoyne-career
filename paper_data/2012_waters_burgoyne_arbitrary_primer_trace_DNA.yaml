- heading: What It Contributed To
  body_html: |-
    <ul>
    <li>Established the theoretical basis (in vitro selection equilibrium) for reproducible arbitrary-primer PCR profiles</li>
    <li>Demonstrated forensic soil discrimination at the kilometre scale using sequence-based metagenome profiling</li>
    <li>Validated DNA-based linking of drug seizures in the peer-reviewed literature</li>
    <li>Anticipated and laid groundwork for next-generation sequencing approaches to forensic metagenomics</li>
    <li>Proposed a practical system of ~10,000 oligonucleotide arrays for standardised forensic soil comparison</li>
    <li>Khodakova, Burgoyne et al. (2013, 2014, 2015) — HTS validation of arbitrary primer soil profiling</li>
    <li>Burgoyne, Koh &amp; Catcheside (2015, 2017) — 50mer condensation approach and definitive methods chapter</li>
    </ul>
